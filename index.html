<script id="sx-v33">
/* ===== Sifex v33 — Pix agent team: every outgoing answer passes a 5-agent council; incoming links are analysed ===== */
(()=>{
const isEn=()=>{try{return LANG==='en'}catch(e){return false}},T=(a,e)=>isEn()?e:a;
const URLRE=/(?:https?:\/\/|www\.)[^\s<>"'،)]+/gi;
const GOOD=/(^|\.)(wikipedia\.org|youtube\.com|youtu\.be|khanacademy\.org|phet\.colorado\.edu|colorado\.edu|google\.com|github\.com|arxiv\.org|nasa\.gov|britannica\.com|hyperphysics\.gsu\.edu|anthropic\.com|claude\.ai)$|\.(edu|gov|edu\.eg|gov\.eg)$/i;
const SHORT=/(^|\.)(bit\.ly|tinyurl\.com|t\.co|goo\.gl|cutt\.ly|is\.gd|rb\.gy|shorturl\.at)$/i;
const LOG=[];let CTX={q:'',intent:'',p:0};
const note=(a,m)=>{LOG.push({a,m,t:Date.now()});if(LOG.length>200)LOG.shift()};

/* Link agent: classify a URL -> {lvl:ok|warn|bad, host, kind, why} */
function judge(u){let x;try{x=new URL(/^https?:/i.test(u)?u:'https://'+u)}catch(e){return{lvl:'bad',host:u,kind:'?',why:T('رابط غير صالح','Malformed link')}}
 const h=x.hostname.toLowerCase(),p=x.pathname.toLowerCase();let lvl='warn',why=T('نطاق غير معروف عندي — افتحه بحذر','Unknown domain — open with care');
 let kind=/\.pdf$/.test(p)?'PDF':/\.(png|jpe?g|gif|webp|svg)$/.test(p)?T('صورة','Image'):/youtu/.test(h)?T('فيديو','Video'):/wikipedia/.test(h)?T('موسوعة','Encyclopedia'):/github/.test(h)?T('كود','Code'):T('صفحة ويب','Web page');
 if(!/^https?:$/.test(x.protocol)||/@/.test(x.username+x.password)||/^\d{1,3}(\.\d{1,3}){3}$/.test(h)||/xn--/.test(h)){return{lvl:'bad',host:h,kind,why:T('مظهر مشبوه (IP/تمويه/بروتوكول غريب)','Suspicious (IP / lookalike / odd protocol)')}}
 if(SHORT.test(h)){why=T('رابط مختصر — الوجهة مخفية','Shortened link — destination hidden')}
 else if(GOOD.test(h)){lvl=x.protocol==='https:'?'ok':'warn';why=lvl==='ok'?T('نطاق معروف + HTTPS','Known domain + HTTPS'):T('نطاق معروف لكن بدون HTTPS','Known domain but not HTTPS')}
 else if(x.protocol==='http:')why=T('بدون تشفير HTTPS','Not encrypted (HTTP)');
 return{lvl,host:h,kind,why}}

/* The council: 5 agents run in order on every outgoing answer */
function council(h){
 /* 1 Sanitizer */
 h=h.replace(/<\s*(script|iframe|object|embed)[\s\S]*?<\/\s*\1\s*>/gi,'').replace(/<\s*(script|iframe|object|embed)[^>]*>/gi,'')
  .replace(/\son(error|load|mouseover|focus)\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'').replace(/(href|src)\s*=\s*(["'])\s*(javascript|data|vbscript):[^"']*\2/gi,'$1=$2#$2');
 /* 2 Link agent */
 h=h.replace(/<a\b([^>]*?)href\s*=\s*(["'])(.*?)\2([^>]*)>/gi,(m,a,q,u,b)=>{if(u[0]==='#'||/^(tel|mailto):/i.test(u)||/onclick/i.test(a+b))return m;
  const j=judge(u);note('link',j.host+':'+j.lvl);
  return '<a'+a+'href='+q+(j.lvl==='bad'?'#':u)+q+b+' target="_blank" rel="noopener noreferrer nofollow" data-v33="'+j.lvl+'" title="'+j.host+' — '+j.why+'">'});
 /* 3 Quality gate: never ship undefined / NaN / [object Object] / an empty bubble */
 const txt=h.replace(/<[^>]+>/g,' ').trim();
 if(/\bundefined\b|\bNaN\b|\[object \w+\]|\bInfinity\b/.test(txt)){h=h.replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(/\bundefined\b|\bNaN\b|\[object \w+\]|\bInfinity\b/g,'—')+'<');note('quality','cleaned')}
 if(!txt&&!/<(img|svg|canvas|button|input|table)/i.test(h)){h='<div class="pix-block">'+T('محتاج توضيح أكتر عشان أجاوبك بدقة — اكتب السؤال بكلمات تانية أو بالأرقام.','I need a bit more detail to answer precisely — rephrase or add numbers.')+'</div>';note('quality','empty')}
 return h}

/* 4 Dedup agent: identical bubble within 1.5s is dropped */
let lastH='',lastT=0;const _b=pixBot;
pixBot=function(h,q){try{if(typeof h==='string'){const now=Date.now();h=council(h);if(h===lastH&&now-lastT<1500){note('dedup','dropped');return}lastH=h;lastT=now}}catch(e){console.warn('v33',e)}return _b.call(this,h,q)};

/* 5 Intake agents: link analysis + intent read before the old pipeline runs */
function linkReport(us){const ic={ok:'🟢',warn:'🟡',bad:'🔴'};
 return '<div class="pix-block"><b>'+T('حلّلت الرابط قبل ما تفتحه:','I checked the link before you open it:')+'</b>'+us.map(u=>{const j=judge(u);return '<div style="margin-top:8px;direction:ltr;text-align:start">'+ic[j.lvl]+' <b>'+j.host+'</b> · '+j.kind+'<br><small>'+j.why+'</small></div>'}).join('')
  +'<div style="margin-top:10px;color:var(--m);font-size:13px">'+T('مقدرش أفتح الصفحة من هنا — الصق النص أو السؤال اللي فيها وأنا أشرحه.','I cannot open the page from here — paste its text or the question and I will explain it.')+'</div></div>'}
const prev=window.pixHandle;
window.pixHandle=function(t){t=String(t||'').trim();if(!t)return prev(t);
 try{if(window.PIXNN){const r=PIXNN.predict(PIXNN.numWords(t)),i=r.top;CTX={q:t,intent:PIXNN.INT[i],p:r.p[i]};note('intent',CTX.intent+':'+Math.round(CTX.p*100))}}catch(e){}
 const us=t.match(URLRE);
 if(us){const rest=t.replace(URLRE,' ').replace(/\s+/g,' ').trim();
  if(rest.length<4){try{pixUser(t)}catch(e){}pixBot(linkReport(us));return Promise.resolve()}
  return Promise.resolve(prev(t)).then(()=>{try{pixBot(linkReport(us))}catch(e){}})}
 return prev(t)};
const css=document.createElement('style');css.textContent='a[data-v33="ok"]::after{content:" ✓";color:#70e000}a[data-v33="warn"]::after{content:" ⚠";color:#ff9f1c}a[data-v33="bad"]::after{content:" ⛔";color:#ff4d6d}';document.head.appendChild(css);
window.PIXTEAM={agents:['Sanitizer','Link','Quality','Dedup','Intake/Intent'],log:LOG,judge,council};
})();
</script>

<script id="sx-v34">
/* ===== Sifex v34 — إصلاح توقف رد Pix على الرسائل القصيرة والمتابعة ===== */
(()=>{
const T=(a,e)=>{try{return (typeof LANG!=='undefined'&&LANG==='en')?e:a}catch(_){return a}};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* 1) أنماط الموافقة / المتابعة بعد التحية */
const AFFIRM=/^(ماشي|ماشي\s*يلا|يلا|يلا\s*بينه|يلا\s*نبدأ|تمام|تمام\s*يلا|هيا|هيا\s*بنا|خلاص\s*يلا|اوك|اوكي|ok|okay|okey|lets?\s*go|let'?s\s*go|go|نعم|ايوه|أيوه|اه|آه|موافق|جاهز|جاهزة|نبدأ|ابدأ|ابدئي|start|yes|yep|sure|حاضر|تحت\s*أمرك)\s*[!.؟?]*$/i;

/* 2) رد متابعة مفيد بدل الصمت */
function affirmReply(){
  return '<div class="pix-block"><b class="k">'+T('ممتاز، نبدأ','Great, let us start')+'</b><br>'+
    T('اختَر سريعًا أو اكتب مسألة بأرقامها:','Pick a quick start or type a problem with numbers:')+'</div>'+
    '<div class="pix-chips">'+
    '<button class="pix-chip pri" onclick="pixAsk(\'اختبرني\')">'+T('🎯 اختبرني','🎯 Quiz me')+'</button>'+
    '<button class="pix-chip" onclick="pixAsk(\'احسب التيار V=12 R=4\')">'+T('مثال: V=12 R=4','Ex: V=12 R=4')+'</button>'+
    '<button class="pix-chip" onclick="pixAsk(\'اشرح قانون أوم\')">'+T('اشرح قانون أوم','Explain Ohm')+'</button>'+
    '<button class="pix-chip" onclick="pixAsk(\'المنهج\')">'+T('📚 المنهج','📚 Syllabus')+'</button>'+
    '</div>';
}

/* 3) تنظيف مؤشرات التفكير العالقة دائمًا */
function clearThink(){
  try{document.querySelectorAll('#pixMsgs .pix-think').forEach(e=>e.remove())}catch(_){}
}

/* 4) التفاف آمن حول pixHandle الحالي */
const prev = window.pixHandle;
window.pixHandle = async function(t){
  t = String(t||'').trim();
  if(!t) return prev ? prev(t) : undefined;

  /* موافقة قصيرة بعد سؤال البوت → رد فوري مفيد */
  if(AFFIRM.test(t)){
    try{
      if(typeof pixUser==='function') pixUser(t);
      clearThink();
      if(typeof pixBot==='function') pixBot(affirmReply());
      return;
    }catch(e){ console.warn('v34 affirm',e); }
  }

  /* رسائل قصيرة جدًا غير مغطاة: لا تترك المستخدم بلا رد */
  const shortCasual = t.length <= 18 && !/[=+\-*/^√]|[\d]{2,}/.test(t) &&
    !/(اشرح|وضح|احسب|قانون|مسال|اختبر|منهج|قوانين|خطه|خطة|معمل|افتح)/.test(t);

  let answered = false;
  const mark = ()=>{ answered = true; };

  /* راقب ظهور أي فقاعة بوت جديدة */
  const el = document.getElementById('pixMsgs');
  let obs = null;
  if(el){
    const before = el.querySelectorAll('.pix-msg.bot').length;
    obs = new MutationObserver(()=>{
      if(el.querySelectorAll('.pix-msg.bot').length > before){ mark(); clearThink(); }
    });
    obs.observe(el,{childList:true,subtree:true});
  }

  try{
    if(prev){
      await Promise.race([
        Promise.resolve(prev(t)).then(()=>{ mark(); }),
        new Promise(r=>setTimeout(r, 9000))
      ]);
    }
  }catch(e){ console.warn('v34 prev',e); }

  await new Promise(r=>setTimeout(r, 280));
  if(obs) try{obs.disconnect()}catch(_){}
  clearThink();

  if(!answered){
    /* مسار طوارئ: لا صمت أبدًا */
    try{
      if(typeof pixUser==='function'){
        /* تجنب تكرار فقاعة المستخدم إن كانت أُضيفت بالفعل */
        const last = el && el.lastElementChild;
        const alreadyUser = last && last.classList.contains('user') && (last.textContent||'').trim()===t;
        if(!alreadyUser) pixUser(t);
      }
    }catch(_){}
    let html = '';
    try{
      if(window.PB && typeof PB.reply==='function'){
        const h = await Promise.race([PB.reply(t), new Promise(r=>setTimeout(()=>r(''),4000))]);
        if(h && String(h).replace(/<[^>]+>/g,' ').trim().length>8) html = h;
      }
    }catch(_){}
    if(!html && shortCasual){
      html = '<div class="pix-block">'+T('فهمتك. قولي عايز إيه بالظبط: شرح قانون، حل مسألة بأرقام، أو اختبار سريع؟','Got it. Tell me exactly what you need: explain a law, solve a numbered problem, or a quick quiz?')+'</div>'+
        '<div class="pix-chips"><button class="pix-chip pri" onclick="pixAsk(\'اختبرني\')">'+T('اختبرني','Quiz me')+'</button>'+
        '<button class="pix-chip" onclick="pixAsk(\'اشرح قانون أوم\')">'+T('اشرح قانون أوم','Explain Ohm')+'</button></div>';
    }
    if(!html){
      html = '<div class="pix-block">'+T('محتاج صيغة أوضح شوية. اكتب المسألة بأرقام (مثلاً: V=12 R=4 احسب I) أو اختَر موضوعًا:','I need a clearer phrasing. Type the problem with numbers (e.g. V=12 R=4 find I) or pick a topic:')+'</div>'+
        '<div class="pix-chips"><button class="pix-chip" onclick="pixAsk(\'المنهج\')">'+T('المنهج','Syllabus')+'</button>'+
        '<button class="pix-chip" onclick="pixAsk(\'اختبرني\')">'+T('اختبرني','Quiz me')+'</button>'+
        '<button class="pix-chip" onclick="pixAsk(\'قوانين الصف\')">'+T('القوانين','Formulas')+'</button></div>';
    }
    try{ if(typeof pixBot==='function') pixBot(html); }catch(e){ console.warn('v34 fb',e); }
  }
  clearThink();
};

/* 5) تعزيز قواعد SM إن وُجدت (موافقة + متابعة) */
try{
  if(typeof SM!=='undefined' && Array.isArray(SM)){
    SM.unshift(
      [AFFIRM, ()=>affirmReply()],
      [/^(ماشي|يلا|تمام|هيا|اوك|ok|yes|نعم|ايوه)\b/i, ()=>affirmReply()]
    );
  }
}catch(e){}

/* 6) ضمان إزالة think عند أي استدعاء لـ pixBot */
try{
  const _pb = window.pixBot;
  if(typeof _pb==='function'){
    window.pixBot = function(h,q){
      clearThink();
      return _pb.apply(this, arguments);
    };
  }
}catch(e){}

console.info('[Sifex v34] Pix silence fix active');
})();
</script>
