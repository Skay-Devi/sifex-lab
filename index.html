<script>
/* SIFEX v6 — grounded local knowledge, actual configurable search, reviewed OCR, stronger lab UX */
(()=>{
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(String(v||''));return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}};

// Extend the local indexed physics corpus with concise, non-duplicated reference cards.
const EXTRA=[
{id:'wave_speed',t:'سرعة الموجة',kw:'+سرعةالموجة +موجات +طولموجي frequency wavelength wave speed',f:'v = f λ',lab:-1,a:'سرعة انتشار الموجة تساوي التردد مضروبًا في الطول الموجي. v بالمتر/ثانية، وf بالهرتز، وλ بالمتر. في الوسط نفسه تتحدد السرعة بخواص الوسط.',m:'لو زاد التردد مع ثبات سرعة الوسط، يقل الطول الموجي؛ لأن حاصل fλ يظل مساويًا للسرعة.',ex:'f = 50 Hz و λ = 0.4 m → v = 50 × 0.4 = 20 m/s.'},
{id:'period',t:'الزمن الدوري والتردد',kw:'+زمن_دوري +تردد +frequency +period',f:'T = 1/f · f = 1/T',lab:-1,a:'الزمن الدوري T هو زمن اهتزازة كاملة، والتردد f هو عدد الاهتزازات في الثانية. وحدته الهرتز Hz، والزمن الدوري بالثانية.',m:'علاقة عكسية: تردد أكبر يعني زمنًا دوريًا أصغر.',ex:'لو f = 5 Hz → T = 1/5 = 0.2 s.'},
{id:'angular_frequency',t:'التردد الزاوي',kw:'+تردد_زاوي +سرعة_زاوية +omega',f:'ω = 2πf = 2π/T',lab:-1,a:'التردد الزاوي ω يقيس معدل تغير الطور الزاوي، ووحدته rad/s. يرتبط بالتردد العادي بالعلاقة ω = 2πf.',m:'كل دورة كاملة تساوي 2π راديان.',ex:'f = 10 Hz → ω = 20π ≈ 62.83 rad/s.'},
{id:'newton2',t:'قانون نيوتن الثاني',kw:'+نيوتن +قانونالحركة +قوة +كتلة +عجلة acceleration',f:'ΣF = m a',lab:-1,a:'محصلة القوى المؤثرة على جسم تساوي كتلته مضروبة في عجلته. القوة بالنيوتن، والكتلة بالكيلوجرام، والعجلة بالمتر/ثانية².',m:'العجلة في اتجاه محصلة القوى، ولا تستخدم قوة واحدة بدل المحصلة إذا كانت هناك قوى متعددة.',ex:'كتلة 2 kg ومحصلّة قوة 6 N → a = 6/2 = 3 m/s².'},
{id:'weight',t:'الوزن',kw:'+وزن +weight +جاذبية +gravity',f:'W = m g',lab:-1,a:'الوزن قوة جذب الكوكب للجسم. قرب سطح الأرض نستخدم g ≈ 9.8 m/s² (وأحيانًا 10 في المسائل المدرسية). الكتلة لا تتغير بتغير المكان بينما الوزن يتغير.',m:'وحدة الوزن نيوتن، ووحدة الكتلة كيلوجرام.',ex:'m = 3 kg و g = 10 m/s² → W = 30 N.'},
{id:'work',t:'الشغل الميكانيكي',kw:'+شغل +work +ازاحة +قوة',f:'W = F d cosθ',lab:-1,a:'الشغل يساوي حاصل ضرب القوة في الإزاحة في جيب تمام الزاوية بينهما. وحدته الجول. إذا كانت القوة عمودية على الإزاحة فالشغل يساوي صفرًا.',m:'الشغل موجب عندما يكون للقوة مركبة في اتجاه الإزاحة، وسالب عندما تعاكسها.',ex:'F = 10 N و d = 2 m وفي نفس الاتجاه → W = 20 J.'},
{id:'kinetic_energy',t:'طاقة الحركة',kw:'+طاقةحركة +kinetic +طاقة +سرعة',f:'K = ½ m v²',lab:-1,a:'طاقة الحركة هي الطاقة المرتبطة بحركة الجسم. تتناسب طرديًا مع الكتلة ومع مربع السرعة، ووحدتها الجول.',m:'مضاعفة السرعة تجعل طاقة الحركة أربعة أمثالها عند ثبات الكتلة.',ex:'m = 2 kg و v = 3 m/s → K = 0.5×2×9 = 9 J.'},
{id:'potential_energy',t:'طاقة وضع الجاذبية',kw:'+طاقةوضع +potential +ارتفاع',f:'U = m g h',lab:-1,a:'قرب سطح الأرض، طاقة وضع الجاذبية تساوي الكتلة × عجلة الجاذبية × الارتفاع عن مستوى مرجعي تختاره.',m:'تتغير قيمة طاقة الوضع بتغير المستوى المرجعي، لكن فرق طاقة الوضع هو المهم في كثير من المسائل.',ex:'m = 2 kg و h = 5 m و g = 10 → U = 100 J.'},
{id:'power_mech',t:'القدرة الميكانيكية',kw:'+قدرةميكانيكية +power +معدل_الشغل',f:'P = W/t',lab:-1,a:'القدرة هي معدل بذل الشغل أو انتقال الطاقة بالنسبة للزمن. وحدتها الوات (W) وتساوي جول/ثانية.',m:'نفس الشغل في زمن أقل يعني قدرة أكبر.',ex:'شغل 600 J خلال 3 s → P = 200 W.'},
{id:'centripetal',t:'العجلة المركزية',kw:'+عجلةمركزية +centripetal +حركةدائرية',f:'a_c = v²/r = ω² r',lab:-1,a:'في الحركة الدائرية المنتظمة يتغير اتجاه السرعة باستمرار، لذلك توجد عجلة مركزية تتجه نحو مركز المسار.',m:'عند ثبات نصف القطر، مضاعفة السرعة تجعل العجلة المركزية أربعة أمثالها.',ex:'v = 4 m/s و r = 2 m → a_c = 16/2 = 8 m/s².'},
{id:'centripetal_force',t:'القوة المركزية',kw:'+قوةمركزية +centripetal force circular',f:'F_c = m v²/r',lab:-1,a:'القوة المركزية هي محصلة القوى في اتجاه مركز المسار الدائري، وليست نوعًا مستقلًا من القوى.',m:'قد يوفرها الشد أو الاحتكاك أو الجاذبية أو المركبة المناسبة من القوة المحصلة حسب المسألة.',ex:'m = 0.5 kg و v = 4 m/s و r = 2 m → F_c = 4 N.'},
{id:'density',t:'الكثافة',kw:'+كثافة +density +كتلة +حجم',f:'ρ = m/V',lab:-1,a:'الكثافة هي الكتلة لكل وحدة حجم. وحدتها في النظام الدولي kg/m³، ويمكن استخدام g/cm³ مع توحيد الوحدات.',m:'1 g/cm³ = 1000 kg/m³. الجسم يطفو على سائل إذا كانت كثافته المتوسطة أقل من كثافة السائل في حالة الاتزان المعتادة.',ex:'كتلة 200 g وحجم 50 cm³ → ρ = 4 g/cm³.'},
{id:'pressure',t:'الضغط',kw:'+ضغط +pressure +مساحة +قوة',f:'p = F/A',lab:-1,a:'الضغط يساوي القوة العمودية على السطح مقسومة على مساحة التلامس. وحدته الباسكال (Pa = N/m²).',m:'لنفس القوة، تقليل المساحة يزيد الضغط.',ex:'قوة 100 N على مساحة 0.5 m² → p = 200 Pa.'},
{id:'hydrostatic',t:'ضغط السائل',kw:'+ضغطالسائل +هيدروستاتيكي +hydrostatic +عمق',f:'p = ρ g h',lab:-1,a:'الزيادة في ضغط السائل عند عمق h تساوي كثافة السائل × g × العمق. هذا هو الضغط المقاس بالنسبة إلى ضغط السطح، أما الضغط المطلق فيضاف إليه ضغط السطح.',m:'يعتمد على العمق وكثافة السائل وعجلة الجاذبية، وليس على شكل الوعاء.',ex:'ρ = 1000 kg/m³ و h = 2 m و g = 10 → Δp = 20000 Pa.'},
{id:'buoyancy',t:'قوة الطفو',kw:'+طفو +ارخميدس +buoyancy +archimedes',f:'F_b = ρ_fluid g V_displaced',lab:-1,a:'قوة الطفو تساوي وزن السائل المزاح، وتتجه إلى أعلى. حجم السائل المزاح يساوي حجم الجزء المغمور من الجسم.',m:'الجسم يطفو عندما يستطيع وزن السائل المزاح موازنة وزن الجسم قبل الغمر الكامل.',ex:'سائل كثافته 1000 kg/m³ وحجم مزاح 0.002 m³ مع g=10 → F_b=20 N.'},
{id:'heat_capacity',t:'السعة الحرارية النوعية',kw:'+حرارةنوعية +specific heat +حرارة +تسخين',f:'Q = m c ΔT',lab:-1,a:'الحرارة اللازمة لتغيير درجة حرارة جسم دون تغير حالته تساوي الكتلة × السعة الحرارية النوعية × التغير في درجة الحرارة.',m:'c خاصية للمادة، ووحدتها J/(kg·K). تختلف الحرارة النوعية باختلاف المادة ودرجة الحرارة.',ex:'m=0.5 kg و c=4200 J/kg.K و ΔT=10 K → Q=21000 J.'},
{id:'latent_heat',t:'الحرارة الكامنة',kw:'+حرارةكامنة +latent heat +انصهار +تبخر',f:'Q = m L',lab:-1,a:'أثناء تغير الحالة الفيزيائية للمادة، قد تمتص أو تطلق حرارة من غير أن تتغير درجة حرارتها عند الضغط الثابت خلال مرحلة التحول.',m:'L حرارة كامنة نوعية، وتختلف للانصهار والتبخر.',ex:'m=0.2 kg و L_f=334000 J/kg → Q=66800 J.'},
{id:'thermal_expansion',t:'التمدد الطولي',kw:'+تمددطولي +thermal expansion +معامل_التمدد',f:'ΔL = α L₀ ΔT',lab:-1,a:'تغير طول جسم صلب تقريبًا يساوي معامل التمدد الطولي × الطول الابتدائي × تغير درجة الحرارة، ضمن مدى صالحية النموذج.',m:'α وحدته K⁻¹، والمواد المختلفة لها معاملات تمدد مختلفة.',ex:'α=12×10⁻⁶ K⁻¹ و L₀=2 m و ΔT=50 K → ΔL=0.0012 m.'},
{id:'snell',t:'قانون سنيل للانكسار',kw:'+سنيل +سنل +snell +انكسار +refraction +معامل_انكسار +قانون_سنيل',f:'n₁ sinθ₁ = n₂ sinθ₂',lab:-1,a:'يربط قانون سنل زاوية السقوط بزاوية الانكسار ومعاملي انكسار الوسطين، وتقاس الزوايا من العمود المقام على السطح الفاصل.',m:'عند الانتقال إلى وسط أعلى معامل انكسار، ينكسر الشعاع مقتربًا من العمود إذا لم يحدث انعكاس كلي.',ex:'من هواء n₁≈1 إلى وسط n₂=1.5 وبزاوية سقوط 30°: sinθ₂=1/3.'},
{id:'lens',t:'معادلة العدسة الرقيقة',kw:'+عدسة +lens +بؤرة +focal',f:'1/f = 1/u + 1/v',lab:-1,a:'في اصطلاح الإشارات المدرسي المناسب، تربط معادلة العدسة الرقيقة البعد البؤري f ببعد الجسم u وبعد الصورة v. يجب الالتزام باصطلاح الإشارات المستخدم في السؤال.',m:'التكبير الخطي يساوي نسبة طول الصورة إلى طول الجسم، ويرتبط بنسبة بعد الصورة إلى بعد الجسم مع مراعاة الإشارة.',ex:'f=10 cm و u=30 cm → 1/v=1/10−1/30=1/15، إذن v=15 cm في هذا الاصطلاح.'},
{id:'electric_field',t:'شدة المجال الكهربي',kw:'+مجالكهربي +electric field +شدةمجال',f:'E = F/q',lab:-1,a:'شدة المجال عند نقطة هي القوة المؤثرة على وحدة الشحنة الاختبارية الموجبة. وحدتها N/C أو V/m.',m:'اتجاه المجال هو اتجاه القوة على شحنة اختبارية موجبة، وخطوط المجال تخرج من الموجب وتدخل في السالب.',ex:'قوة 0.02 N على شحنة اختبارية 0.001 C → E=20 N/C.'},
{id:'electric_potential',t:'فرق الجهد الكهربي',kw:'+فرقجهد +potential difference +فولت',f:'V = W/q',lab:-1,a:'فرق الجهد هو الشغل المبذول لكل وحدة شحنة لنقلها بين نقطتين وفق تعريف المسألة. وحدته الفولت = جول/كولوم.',m:'فرق الجهد كمية قياسية، بينما المجال الكهربي كمية متجهة.',ex:'شغل 12 J لنقل شحنة 3 C → V=4 V.'},
{id:'capacitor_energy',t:'طاقة المكثف',kw:'+طاقةالمكثف +capacitor energy +شحنة',f:'U = ½ C V² = ½ QV = Q²/(2C)',lab:13,a:'يختزن المكثف طاقة في المجال الكهربي بين لوحيه. يمكن حسابها من السعة وفرق الجهد أو الشحنة.',m:'عند ثبات C، مضاعفة V تجعل الطاقة أربعة أمثالها.',ex:'C=10 μF و V=10 V → U=0.5×10⁻⁵×100=5×10⁻⁴ J.'},
{id:'magnetic_flux',t:'الفيض المغناطيسي',kw:'+فيض +magnetic flux +فاراداي',f:'Φ = B A cosθ',lab:5,a:'الفيض المغناطيسي خلال سطح يساوي حاصل ضرب المجال في مساحة السطح وفي جيب تمام الزاوية بين المجال والعمود على السطح. وحدته ويبر Wb.',m:'إذا كانت الزاوية بين المجال والعمود صفرًا يكون الفيض أعظم ما يمكن، وإذا كان المجال موازيًا للسطح يكون الفيض صفرًا.',ex:'B=0.2 T و A=0.5 m² و θ=60° → Φ=0.05 Wb.'},
{id:'lorentz_work',t:'شغل القوة المغناطيسية',kw:'+شغلقوةمغناطيسية +لورنتز +طاقة',f:'W_B = 0',lab:20,a:'القوة المغناطيسية على شحنة متحركة تكون عمودية على سرعتها؛ لذلك لا تبذل شغلًا ولا تغير مقدار سرعة الجسيم في مجال مغناطيسي منتظم وحده، لكنها قد تغير اتجاه الحركة.',m:'هذا الاستنتاج يفترض أن القوة الوحيدة المؤثرة هي القوة المغناطيسية.',ex:'قد ينحني مسار جسيم مشحون في المجال مع ثبات طاقة حركته.'},
{id:'radioactivity_activity',t:'النشاط الإشعاعي',kw:'+نشاطاشعاعي +activity +بيكريل +becquerel',f:'A = λN',lab:21,a:'النشاط الإشعاعي هو معدل حدوث التحللات النووية. يقاس بالبيكريل (Bq)، حيث 1 Bq يساوي تحللًا واحدًا في الثانية.',m:'النشاط يتناسب مع عدد الأنوية غير المتحللة وثابت التحلل λ، ويقل مع الزمن.',ex:'إذا λ=0.01 s⁻¹ و N=10000 → A=100 Bq.'}
,
{id:'snell',t:'قانون سنيل للانكسار',kw:'+سنيل +سنل +snell +انكسار +انكسارالضوء +refraction +قانون_سنيل',f:'n₁ sinθ₁ = n₂ sinθ₂',lab:-1,a:'عند انتقال الضوء من وسط لآخر يتغير اتجاهه حسب معاملي الانكسار. القانون: n₁ sinθ₁ = n₂ sinθ₂. الزاوية تُقاس من العمود على السطح الفاصل.',m:'لو الضوء داخل من وسط أكبر معامل انكسار لوسط أصغر، ممكن يحصل انعكاس كلي داخلي لما θ أكبر من الزاوية الحرجة.',ex:'من هواء n=1 لماء n=1.33 بزاوية سقوط 30° → sinθ₂ = sin30/1.33 ≈ 0.376 → θ₂ ≈ 22.1°.'},
{id:'critical_angle',t:'الزاوية الحرجة والانعكاس الكلي',kw:'+زاويةحرجة +انعكاسكلي total internal reflection critical',f:'sinθc = n₂/n₁  (n₁>n₂)',lab:-1,a:'الزاوية الحرجة هي زاوية السقوط اللي الزاوية المنكسرة عندها تبقى 90°. لو زادنا زاوية السقوط عنها بيحصل انعكاس كلي داخلي.',m:'مهم في الألياف البصرية والمناظير.',ex:'زجاج n=1.5 لهواء → sinθc = 1/1.5 = 0.667 → θc ≈ 41.8°.'},
{id:'lens_formula',t:'قانون العدسات',kw:'+عدسه +عدسات +lens +بؤره focal',f:'1/f = 1/v − 1/u  أو  1/f = 1/v + 1/u حسب الاصطلاح',lab:-1,a:'قانون العدسات بيربط البعد البؤري f ببعد الجسم u وبعد الصورة v. الاصطلاح المدرسي يختلف أحيانًا في الإشارات، فخليك ثابت على الاصطلاح اللي في كتابك.',m:'العدسة المحدبة (المجمعة) f موجب، والمقعرة (المفرقة) f سالب في الاصطلاح الشائع.',ex:'f=10 cm و u=30 cm (جسم حقيقي) → 1/v = 1/10 − 1/30 = 1/15 → v=15 cm.'},
{id:'magnification',t:'التكبير الخطي',kw:'+تكبير +magnification +صوره',f:'m = h′/h = v/u',lab:-1,a:'التكبير الخطي هو نسبة طول الصورة لطول الجسم، ويساوي كمان نسبة بعد الصورة لبعد الجسم (مع مراعاة الإشارة حسب الاصطلاح).',m:'|m|>1 يعني صورة مكبرة، |m|<1 مصغرة، وعلامة سالبة غالبًا تعني صورة مقلوبة.',ex:'v=15 cm و u=30 cm → m = −0.5 (صورة مصغرة ومقلوبة في الاصطلاح الشائع).'},
{id:'young_double',t:'تجربة يونج (التداخل)',kw:'+يونج +تداخل +شقين young interference fringe',f:'Δy = λ D / d',lab:-1,a:'في تجربة الشقين ليونج، المسافة بين هدبتين متتاليتين على الشاشة Δy = λD/d حيث d المسافة بين الشقين و D بعد الشاشة.',m:'الضوء الأحادي اللون يعطي هدب واضحة. زيادة d تصغر المسافة بين الهدب.',ex:'λ=600 nm و D=1 m و d=0.3 mm → Δy = 2 mm.'},
{id:'photoelectric_threshold',t:'تردد العتبة والجهد المقطوع',kw:'+عتبه +جهدمقطوع threshold stopping potential photoelectric',f:'hf₀ = φ  ·  eVs = KE_max',lab:6,a:'تردد العتبة f₀ هو أقل تردد يطلع إلكترونات (لما KE=0). الجهد المقطوع Vs يوقف أسرع إلكترونات، و eVs = KE_max.',m:'لو التردد أقل من f₀ مفيش انبعاث مهما زودت الشدة.',ex:'φ=2 eV → f₀ = φ/h ≈ 4.84×10¹⁴ Hz.'},
{id:'debroglie_electron',t:'موجة دي برولي للإلكترون',kw:'+ديبرولي +الكترون +موجيه debroglie electron',f:'λ = h / p = h / √(2mE)',lab:15,a:'أي جسيم له كمية حركة p له طول موجي λ=h/p. للإلكترون غير النسبي λ = h/√(2mE).',m:'كل ما زادت طاقة الإلكترون قل طوله الموجي، وده أساس الميكروسكوب الإلكتروني.',ex:'E=150 eV → λ ≈ 0.1 nm تقريبًا.'},
{id:'half_life',t:'عمر النصف',kw:'+عمرنصف +half life +تحلل',f:'T½ = ln2 / λ ≈ 0.693/λ',lab:21,a:'عمر النصف هو الزمن اللي بيتنصف فيه عدد الأنوية المشعة. ثابت التحلل λ = 0.693/T½.',m:'بعد n عمر نصف يتبقى (1/2)^n من الكمية الأصلية.',ex:'T½=2 ساعة → بعد 6 ساعات يتبقى 1/8.'},
{id:'ideal_gas',t:'قانون الغاز المثالي',kw:'+غازمثالي +ضغط +حجم ideal gas',f:'PV = nRT',lab:-1,a:'للغاز المثالي: حاصل ضرب الضغط في الحجم يساوي عدد المولات × الثابت العام × درجة الحرارة المطلقة.',m:'درجة الحرارة لازم بالكلفن (K = °C + 273).',ex:'n=1 mol و T=300 K و V=0.025 m³ → P = nRT/V ≈ 10⁵ Pa.'},
{id:'boyle',t:'قانون بويل',kw:'+بويل +boyle ضغط حجم',f:'P₁V₁ = P₂V₂  (عند ثبات T)',lab:-1,a:'عند ثبات درجة الحرارة، حاصل ضرب ضغط الغاز المثالي في حجمه ثابت.',m:'لو الحجم اتضغط للنص، الضغط يتضاعف.',ex:'P₁=1 atm و V₁=4 L → لو V₂=2 L يبقى P₂=2 atm.'},
{id:'charles',t:'قانون شارل',kw:'+شارل +charles حجم حرارة',f:'V₁/T₁ = V₂/T₂  (عند ثبات P)',lab:-1,a:'عند ثبات الضغط، حجم الغاز المثالي يتناسب طرديًا مع درجة حرارته المطلقة.',m:'لازم تستخدم كلفن مش سيليزيوس.',ex:'V₁=2 L عند 300 K → عند 600 K يصبح V=4 L.'},
{id:'specific_heat',t:'الحرارة النوعية',kw:'+حرارةنوعية +specific heat +سعرات',f:'Q = m c ΔT',lab:-1,a:'كمية الحرارة اللازمة لرفع درجة حرارة كتلة m بمقدار ΔT تساوي m c ΔT، حيث c الحرارة النوعية للمادة.',m:'الماء له c عالية (≈ 4180 J/kg·°C) عشان كده بيسخن ويبرد ببطء نسبيًا.',ex:'m=0.5 kg ماء و ΔT=10°C → Q ≈ 20900 J.'},
{id:'latent_heat',t:'الحرارة الكامنة',kw:'+كامنه +latent +انصهار +تبخر',f:'Q = m L',lab:-1,a:'الحرارة الكامنة هي كمية الحرارة اللازمة لتغيير حالة المادة بدون تغيير درجة الحرارة (انصهار أو تبخر).',m:'L_f للانصهار و L_v للتبخر. الماء: Lf≈334 kJ/kg و Lv≈2260 kJ/kg.',ex:'صهر 0.1 kg ثلج عند 0°C → Q = 33.4 kJ.'},
{id:'ohms_power',t:'القدرة والمقاومة',kw:'+قدره +مقاومه +حراره joule heating',f:'P = I²R = V²/R',lab:17,a:'القدرة الحرارية المفقودة في مقاومة تساوي I²R. كل ما زادت المقاومة أو التيار زادت الحرارة المتولدة (تأثير جول).',m:'السخانات تعتمد على تحويل القدرة الكهربية لحرارة.',ex:'I=2 A و R=50 Ω → P=200 W.'},
{id:'series_parallel_mix',t:'دوائر مركبة',kw:'+مركبه +توالي توازي mixed circuit',f:'حل الجزء التوازي أولًا ثم التوالي',lab:2,a:'في الدوائر المركبة بنحسب المقاومة المكافئة للجزء المتوازي أولًا، بعدين نضيف المقاومات المتوالية.',m:'ارسم الدائرة وبسّطها خطوة بخطوة.',ex:'مقاومتين 6Ω متوازيتين → 3Ω، وبعدين مع 2Ω توالي → Req=5Ω.'},
{id:'kirchhoff_loop',t:'قانون كيرشوف للجهد',kw:'+كيرشوف +حلقه loop kirchhoff voltage',f:'ΣV = 0 حول أي مسار مغلق',lab:-1,a:'مجموع الارتفاعات والانخفاضات في الجهد حول أي مسار مغلق في الدائرة يساوي صفر (حفظ الطاقة).',m:'اتفق على اتجاه المسار، وكل ما تمشي مع التيار في مقاومة تحسب هبوط V=IR.',ex:'بطارية 12V ومقاومتين 2Ω و 4Ω توالي → التيار 2A، وهبوط 4V و 8V.'},
{id:'magnetic_force_charge',t:'قوة على شحنة متحركة',kw:'+لورنتز +شحنة متحركة lorentz charge',f:'F = q v B sinθ',lab:20,a:'شحنة تتحرك في مجال مغناطيسي تتأثر بقوة عمودية على السرعة والمجال. مقدارها qvB sinθ.',m:'القوة لا تغير مقدار السرعة (لا تبذل شغل) لكن تغير الاتجاه فتعمل مسار دائري أو حلزوني.',ex:'q=1.6×10⁻¹⁹ C و v=10⁶ m/s و B=0.5 T عمودي → F=8×10⁻¹⁴ N.'},
{id:'cyclotron_radius',t:'نصف قطر المسار الدائري',kw:'+نصفقطر +سايكلوترون cyclotron radius',f:'r = m v / (q B)',lab:20,a:'في مجال مغناطيسي منتظم عمودي على السرعة، الشحنة تتحرك في دائرة نصف قطرها r = mv/(qB).',m:'كل ما زاد المجال أو الشحنة قل نصف القطر.',ex:'بروتون v=10⁶ m/s و B=0.5 T → r ≈ 2.09 cm.'},
{id:'transformer_power',t:'قدرة المحول',kw:'+محول +قدره transformer efficiency',f:'Pp ≈ Ps  (مثالي) ·  η = Ps/Pp',lab:8,a:'في المحول المثالي القدرة الداخلة تساوي الخارجة. عمليًا في فقد بسيط، والكفاءة η = Ps/Pp.',m:'المحول لا يغيّر التردد، يغيّر الجهد والتيار بنسبة اللفات.',ex:'Vp=220 V و Vs=22 V و Ip=1 A → Is≈10 A (مثالي).'},
{id:'rlc_resonance',t:'رنين دائرة RLC',kw:'+رنين +rlc resonance impedance',f:'f₀ = 1/(2π√(LC)) · عند الرنين Z=R',lab:14,a:'عند تردد الرنين، مفاعلة الملف تساوي مفاعلة المكثف فتلغي بعض، والمعاوقة تبقى أصغر حاجة = R والتيار أكبر حاجة.',m:'منحنى التيار ضد التردد بيبقى حاد لو R صغيرة (دائرة اختيارية جيدة).',ex:'L=0.1 H و C=10 μF → f₀ ≈ 159 Hz.'},
{id:'capacitive_reactance',t:'مفاعلة المكثف',kw:'+مفاعله +مكثف xc capacitive',f:'Xc = 1/(2πf C)',lab:13,a:'مفاعلة المكثف تقل مع زيادة التردد والسعة. عند التيار المستمر (f=0) المكثف يعمل كدائرة مفتوحة.',m:'وحدة المفاعلة أوم زي المقاومة، لكنها لا تبدد قدرة متوسطة.',ex:'C=100 μF و f=50 Hz → Xc ≈ 31.8 Ω.'},
{id:'inductive_reactance',t:'مفاعلة الملف',kw:'+مفاعله +ملف xl inductive',f:'XL = 2πf L',lab:4,a:'مفاعلة الملف تزداد مع التردد ومع معامل الحث الذاتي. عند التيار المستمر الملف يعمل كمقاومة صغيرة (مقاومته الأومية فقط).',m:'الملف يعاكس التغير في التيار.',ex:'L=0.2 H و f=50 Hz → XL ≈ 62.8 Ω.'},
{id:'joule_law',t:'قانون جول للحرارة',kw:'+جول +حراره كهربية joule heating',f:'H = I² R t',lab:17,a:'الحرارة المتولدة في موصل = مربع التيار × المقاومة × الزمن. وحدة الحرارة هنا جول.',m:'أساس عمل السخانات والمكاوي والفيوز.',ex:'I=3 A و R=20 Ω و t=60 s → H=10800 J.'},
{id:'resistivity_temp',t:'تغير المقاومة مع الحرارة',kw:'+مقاومه حراره +معاملحراري temperature coefficient',f:'R = R₀ (1 + α ΔT)',lab:23,a:'مقاومة معظم الفلزات تزيد مع ارتفاع درجة الحرارة. α هو المعامل الحراري للمقاومة.',m:'في الثرمستور (NTC) المقاومة تقل مع ارتفاع الحرارة.',ex:'R₀=100 Ω و α=0.004 و ΔT=50°C → R=120 Ω.'},
{id:'electric_power_home',t:'استهلاك الطاقة المنزلية',kw:'+كيلووات +ساعه +فاتوره kwh energy bill',f:'E = P t  (بالكيلووات ساعة)',lab:17,a:'الطاقة الكهربية المستهلكة = القدرة × الزمن. العداد بيحسب بالكيلووات ساعة (kWh).',m:'جهاز 2000 W يشتغل ساعة = 2 kWh.',ex:'سخان 1500 W لمدة 2 ساعة → 3 kWh.'},
{id:'waves_types',t:'أنواع الموجات',kw:'+موجات طولية مستعرضة longitudinal transverse',f:'',lab:-1,a:'الموجات المستعرضة: الاهتزاز عمودي على اتجاه الانتشار (الضوء، موجات على وتر). الطولية: الاهتزاز في نفس اتجاه الانتشار (الصوت في الهواء).',m:'الصوت يحتاج وسط مادي، والضوء لا يحتاج.',ex:'الصوت في الهواء طولي، وموجات البحر مستعرضة تقريبًا.'},
{id:'sound_speed',t:'سرعة الصوت',kw:'+سرعةالصوت +sound speed هواء',f:'v ≈ 340 m/s في الهواء عند 20°C',lab:-1,a:'سرعة الصوت تعتمد على الوسط ودرجة الحرارة. في الهواء تقريبًا 340 m/s عند درجة حرارة الغرفة، وأسرع في السوائل والمواد الصلبة.',m:'كل ما ارتفعت درجة حرارة الهواء زادت سرعة الصوت قليلًا.',ex:'صوت رعد يوصل بعد 3 ثواني → المسافة ≈ 1 km.'},
{id:'hooke',t:'قانون هوك',kw:'+هوك +مرونه +نابض hooke spring',f:'F = k x',lab:-1,a:'القوة اللازمة لمط نابض تتناسب طرديًا مع الاستطالة (في حدود المرونة). k ثابت النابض.',m:'طاقة وضع المرونة = ½ k x².',ex:'k=200 N/m و x=0.05 m → F=10 N.'},
{id:'pressure',t:'الضغط',kw:'+ضغط +pressure باسكال',f:'P = F / A',lab:-1,a:'الضغط = القوة العمودية ÷ المساحة. وحدته الباسكال (N/m²).',m:'نفس القوة على مساحة أصغر تعطي ضغط أكبر (سكينة حادة).',ex:'F=100 N على A=0.01 m² → P=10⁴ Pa.'},
{id:'archimedes',t:'مبدأ أرخميدس',kw:'+ارخميدس +طفو +دفع buoyancy archimedes',f:'F_b = ρ_fluid V_displaced g',lab:-1,a:'الجسم المغمور كليًا أو جزئيًا في مائع يتعرض لقوة دفع لأعلى تساوي وزن المائع المزاح.',m:'لو كثافة الجسم أقل من كثافة السائل يطفو.',ex:'حجم مغمور 0.002 m³ في ماء → F_b ≈ 19.6 N.'},
{id:'density_def',t:'الكثافة',kw:'+كثافه +density',f:'ρ = m / V',lab:-1,a:'الكثافة = الكتلة ÷ الحجم. وحدة شائعة g/cm³ أو kg/m³ (1 g/cm³ = 1000 kg/m³).',m:'كثافة الماء ≈ 1 g/cm³. الحديد ≈ 7.8 g/cm³.',ex:'كتلة 200 g وحجم 25 cm³ → ρ = 8 g/cm³.'},
{id:'newton3',t:'قانون نيوتن الثالث',kw:'+نيوتنثالث +فعل ردفعل action reaction',f:'F₁₂ = −F₂₁',lab:-1,a:'لكل فعل رد فعل مساوٍ له في المقدار ومضاد في الاتجاه، والقوتان تؤثران على جسمين مختلفين.',m:'القوتان لا تلغيان بعض لأنهما على جسمين مش نفس الجسم.',ex:'الكتاب يضغط على الطاولة، والطاولة ترد بقوة مساوية لأعلى.'},
{id:'momentum_conservation',t:'حفظ كمية الحركة',kw:'+حفظ كميةالحركة conservation momentum تصادم',f:'Σp_before = Σp_after',lab:-1,a:'في نظام معزول (مفيش قوى خارجية محصلة)، كمية الحركة الكلية محفوظة قبل وبعد التصادم.',m:'التصادم المرن يحفظ الطاقة الحركية كمان، وغير المرن لا.',ex:'جسمين متساويين الكتلة، واحد ساكن والآخر بسرعة v → بعد تصادم مرن مباشر يتبادلان السرعات.'},
{id:'circular_motion',t:'الحركة الدائرية المنتظمة',kw:'+دائريه +مركزي centripetal',f:'a_c = v²/r · F_c = m v²/r',lab:-1,a:'جسم يتحرك بسرعة ثابتة المقدار على دائرة يحتاج عجلة مركزية نحو المركز، وبالتالي قوة مركزية.',m:'القوة المركزية مش قوة جديدة، هي محصلة القوى نحو المركز (شد الخيط، جاذبية...).',ex:'v=10 m/s و r=5 m و m=2 kg → F_c = 40 N.'},
{id:'work_energy_theorem',t:'نظرية الشغل والطاقة',kw:'+شغل طاقه work energy theorem',f:'W_net = ΔK',lab:-1,a:'الشغل الكلي المبذول على جسم يساوي التغير في طاقة حركته.',m:'مفيدة جدًا لما القوى متغيرة أو المسار معقد.',ex:'شغل صافٍ 50 J على جسم ساكن → KE النهائية = 50 J.'},
{id:'efficiency',t:'الكفاءة',kw:'+كفاءه +efficiency',f:'η = (القدرة أو الطاقة المفيدة / الكلية) × 100%',lab:-1,a:'الكفاءة نسبة الطاقة (أو القدرة) المفيدة إلى الطاقة الكلية المبذولة.',m:'لا توجد آلة كفاءتها 100% عمليًا بسبب الفقد (حرارة، احتكاك...).',ex:'آلة تأخذ 500 J وتعطي شغل مفيد 350 J → η = 70%.'},
{id:'coulomb_constant',t:'ثابت كولوم',kw:'+ثابت كولوم k coulomb constant',f:'k = 9×10⁹ N·m²/C²',lab:7,a:'ثابت التناسب في قانون كولوم في الفراغ (أو الهواء تقريبًا).',m:'في أوساط عازلة القوة تقل بمعامل السماحية النسبية.',ex:'شحتنان 1 μC على بعد 1 m → F = 9×10⁻³ N.'},
{id:'electric_field_uniform',t:'مجال منتظم بين لوحَين',kw:'+مجال منتظم parallel plates',f:'E = V / d',lab:7,a:'بين لوحي مكثف مستوٍ متوازيين المجال يكون منتظم تقريبًا في المنتصف، وشدته V/d.',m:'اتجاه المجال من اللوح الموجب للسالب.',ex:'V=12 V و d=2 cm → E = 600 V/m.'},
{id:'capacitance_parallel_series',t:'توصيل المكثفات',kw:'+مكثفات توالي توازي capacitors series parallel',f:'توازي: C = C₁+C₂ · توالي: 1/C = 1/C₁+1/C₂',lab:13,a:'عكس المقاومات تقريبًا: التوازي يجمع السعات، والتوالي يقلل السعة المكافئة.',m:'في التوالي الشحنة واحدة، وفي التوازي الجهد واحد.',ex:'10 μF و 10 μF توازي → 20 μF، توالي → 5 μF.'},
{id:'magnetic_field_wire',t:'مجال سلك مستقيم طويل',kw:'+مجال سلك wire magnetic field ampere',f:'B = μ₀ I / (2π d)',lab:10,a:'مجال سلك مستقيم طويل عند نقطة تبعد d عنه = μ₀I/(2πd). الاتجاه بقاعدة اليد اليمنى.',m:'المجال يلتف حول السلك على شكل دوائر.',ex:'I=10 A و d=5 cm → B ≈ 4×10⁻⁵ T.'},
{id:'faraday_motional',t:'القوة الدافعة الحركية',kw:'+دافعه حركيه motional emf قضيب',f:'ε = B ℓ v',lab:5,a:'قضيب يتحرك بسرعة v عموديًا على مجال B وطوله ℓ (عمودي كمان) تتولد فيه emf = Bℓv.',m:'سببها تغير الفيض أو قوة لورنتز على الشحنات داخل القضيب.',ex:'B=0.4 T و ℓ=0.5 m و v=2 m/s → ε=0.4 V.'},
{id:'lenz_law',t:'قاعدة لنز',kw:'+لنز +اتجاه التيار المستحث lenz',f:'الاتجاه يعاكس سبب التغير',lab:5,a:'التيار المستحث يولد مجالًا يعاكس التغير في الفيض الذي سببه. الإشارة السالبة في قانون فاراداي تعبر عن ذلك.',m:'لو الفيض الداخل بيزيد، التيار يولد فيض معاكس للداخل.',ex:'مغناطيس يقترب من ملف بقطب شمالي → الملف يواجهه بقطب شمالي.'},
{id:'self_inductance_energy',t:'طاقة الملف',kw:'+طاقه ملف inductance energy',f:'U = ½ L I²',lab:22,a:'الملف يخزن طاقة في مجاله المغناطيسي تساوي ½LI².',m:'شبيهة بطاقة المكثف ½CV².',ex:'L=0.5 H و I=2 A → U=1 J.'},
{id:'ac_rms',t:'القيمة الفعالة للتيار المتردد',kw:'+فعاله +rms متردد effective',f:'I_rms = I₀ / √2 · V_rms = V₀ / √2',lab:-1,a:'القيمة الفعالة (RMS) هي القيمة اللي تعطي نفس القدرة الحرارية في مقاومة لو كان التيار مستمر. للأسي النقي = القيمة العظمى على جذر 2.',m:'الأجهزة المنزلية تُعلَّم بالقيم الفعالة (220 V مثلاً).',ex:'V₀=311 V → V_rms ≈ 220 V.'},
{id:'power_factor',t:'معامل القدرة',kw:'+معاملقدره power factor cosφ',f:'P = V_rms I_rms cosφ',lab:19,a:'في دوائر التيار المتردد القدرة المتوسطة = VI cosφ، حيث φ فرق الطور بين الجهد والتيار.',m:'عند الرنين في RLC متوالية φ=0 و cosφ=1 فالقدرة أكبر ما يمكن.',ex:'V=220 V و I=2 A و cosφ=0.8 → P=352 W.'},
{id:'semiconductor',t:'أشباه الموصلات',kw:'+شبه موصل +سيليكون semiconductor diode',f:'',lab:-1,a:'مواد مقاومتها بين الموصلات والعوازل (سيليكون، جرمانيوم). يمكن التحكم في توصيليتها بالتطعيم والحرارة والجهد.',m:'أساس الثنائيات والترانزستورات والدوائر المتكاملة.',ex:'الثنائي يمرر التيار في اتجاه ويمنعه في الاتجاه المعاكس تقريبًا.'},
{id:'led_principle',t:'مبدأ عمل الـ LED',kw:'+led +ثنائي باعث diode light',f:'',lab:-1,a:'الثنائي الباعث للضوء يصدر فوتونات عندما تتحد إلكترونات الثقوب عند مرور تيار أمامي، وطاقة الفوتون مرتبطة بفجوة الطاقة.',m:'يحتاج جهد أمامي مناسب (حوالي 2–3 V حسب اللون) ومقاومة تحديد تيار.',ex:'LED أحمر عادة يحتاج تيار بضعة ملي أمبير وجهد ~2 V.'},
{id:'nuclear_binding',t:'طاقة الربط النووي',kw:'+طاقهربط +نواه binding energy',f:'E = Δm c²',lab:-1,a:'طاقة الربط هي الطاقة اللازمة لتفكيك النواة إلى بروتونات ونيوترونات حرة. تنتج من نقص الكتلة Δm.',m:'كلما زادت طاقة الربط لكل نيوكليون زادت استقرار النواة.',ex:'نقص كتلة صغير ينتج طاقة هائلة حسب E=mc².'},
{id:'fusion_fission',t:'الانشطار والاندماج',kw:'+انشطار +اندماج fission fusion',f:'',lab:-1,a:'الانشطار: انقسام نواة ثقيلة لنوى أخف مع انطلاق طاقة (مفاعلات نووية). الاندماج: اتحاد نوى خفيفة لنواة أثقل (الشمس، قنابل هيدروجينية).',m:'الاندماج يحتاج درجات حرارة رهيبة للتغلب على التنافر الكهربي.',ex:'الشمس تعمل بالاندماج النووي للهيدروجين.'},
{id:'optics_mirror',t:'المرايا الكروية',kw:'+مرايا +كرويه concave convex mirror',f:'1/f = 1/v + 1/u',lab:-1,a:'قانون المرايا مشابه لقانون العدسات مع اصطلاح إشارات. المرآة المقعرة مجمعة والمحدبة مفرقة.',m:'البعد البؤري للمرآة الكروية ≈ نصف نصف القطر (f=R/2).',ex:'مرآة مقعرة R=40 cm → f=20 cm.'},
{id:'polarization',t:'استقطاب الضوء',kw:'+استقطاب +polarization ضوء',f:'',lab:-1,a:'الضوء مستعرض ويمكن استقطابه (اهتزاز في مستوى واحد). الضوء العادي غير مستقطب، والمستقطب يمرر مركبة معينة.',m:'يستخدم في النظارات الشمسية لتقليل الوهج، وفي شاشات LCD.',ex:'مرشحان متعامدان يحجبان الضوء تقريبًا تمامًا.'},
{id:'uncertainty',t:'مبدأ عدم التحديد لهيزنبرج',kw:'+هيزنبرج +عدم تحديد uncertainty',f:'Δx · Δp ≥ h/(4π)',lab:-1,a:'لا يمكن تحديد موضع جسيم وكمية حركته بدقة مطلقة في نفس الوقت. حاصل عدم التعيين لهما له حد أدنى.',m:'مهم على المستوى الذري، وتأثيره ضئيل جدًا على الأجسام الكبيرة.',ex:'تحديد موضع إلكترون بدقة عالية يزيد عدم تعيين سرعته.'},
{id:'atomic_spectra',t:'الأطياف الذرية',kw:'+طيف +ذري spectra emission absorption',f:'',lab:9,a:'الذرات تنبعث أو تمتص أطوالاً موجية محددة مرتبطة بفروق مستويات الطاقة. طيف الانبعاث خطوط مضيئة، والامتصاص خطوط مظلمة.',m:'كل عنصر له بصمة طيفية خاصة.',ex:'طيف الهيدروجين يمكن حساب خطوطه من نموذج بوهر تقريبًا.'},
{id:'laser_principle',t:'مبدأ الليزر',kw:'+ليزر +laser انبعاثمحفز',f:'',lab:-1,a:'الليزر يعتمد على الانبعاث المحفز وتكبير الضوء في تجويف مرنان، فينتج ضوء أحادي اللون مترابط وشديد التوجيه.',m:'يستخدم في الطب والاتصالات والقياس والصناعة.',ex:'ليزر هيليوم-نيون شائع في المعامل التعليمية.'},
{id:'error_analysis',t:'الأخطاء والقياسات',kw:'+خطاء +قياس +دقه error uncertainty measurement',f:'',lab:-1,a:'كل قياس له عدم تعيين. الخطأ النسبي = (الخطأ المطلق / القيمة المقاسة). مهم تكتب الناتج بعدد أرقام معنوية مناسب.',m:'كرر القياس وخذ المتوسط لتقليل الخطأ العشوائي.',ex:'طول 12.3 ± 0.1 cm → خطأ نسبي ≈ 0.8%.'},
{id:'graph_slope',t:'الميل في الرسوم البيانية',kw:'+ميل +رسم بياني slope graph',f:'الميل = Δy / Δx',lab:-1,a:'في رسم V ضد I لمقاومة أومية، الميل = R. في رسم s ضد t² للحركة بعجلة ثابتة الميل مرتبط بالعجلة.',m:'اختار مقياس مناسب وخذ نقطتين بعيدتين على الخط المستقيم.',ex:'ΔV=6 V و ΔI=2 A → R=3 Ω.'},
{id:'units_si',t:'وحدات النظام الدولي',kw:'+وحدات +si متر كيلوجرام ثانيه',f:'',lab:-1,a:'الوحدات الأساسية: متر، كيلوجرام، ثانية، أمبير، كلفن، مول، كانديلا. باقي الوحدات مشتقة (نيوتن، جول، واط، فولت...).',m:'دايمًا حول للوحدات الأساسية قبل التعويض في القوانين.',ex:'1 kWh = 3.6×10⁶ J.'},
{id:'vectors_basics',t:'المتجهات',kw:'+متجهات +مركبات vectors components',f:'Fx = F cosθ · Fy = F sinθ',lab:-1,a:'المتجه له مقدار واتجاه. نحلل القوة لمتجهين متعامدين عشان نسهل الجمع.',m:'المحصلة تُوجد بالمركبات أو بقاعدة متوازي الأضلاع.',ex:'F=10 N بزاوية 30° → Fx≈8.66 N و Fy=5 N.'},
{id:'projectile',t:'القذيفة',kw:'+قذيفه +مقذوفات projectile range',f:'R = v² sin2θ / g · H = v² sin²θ /(2g)',lab:-1,a:'جسم يُقذف بزاوية مع الأفقي (بإهمال مقاومة الهواء) له مدى أفقي أقصى عند 45°، وأعلى ارتفاع يعتمد على مركبة السرعة الرأسية.',m:'الزمن الكلي للطيران = 2 v sinθ / g.',ex:'v=20 m/s و θ=45° و g=10 → R=40 m.'},
{id:'friction',t:'الاحتكاك',kw:'+احتكاك +friction سكوني حركي',f:'f_s ≤ μ_s N · f_k = μ_k N',lab:-1,a:'قوة الاحتكاك تعاكس الميل للحركة النسبية. الاحتكاك السكوني حده الأقصى μ_s N، والحركي عادة أصغر قليلًا.',m:'N هو القوة العمودية بين السطحين.',ex:'μ_k=0.2 و N=50 N → f_k=10 N.'},
{id:'simple_harmonic',t:'الحركة التوافقية البسيطة',kw:'+توافقيه +بندول +نابض shm harmonic',f:'T = 2π √(m/k) · T = 2π √(L/g)',lab:-1,a:'حركة اهتزازية حول موضع اتزان بقوة تناسب الإزاحة وتعاكسها. زمنها الدوري للنابض 2π√(m/k) وللبندول البسيط 2π√(L/g).',m:'التردد لا يعتمد على السعة (في التقريب الصغير للبندول).',ex:'m=0.1 kg و k=40 N/m → T≈0.31 s.'},
{id:'gravitation_potential',t:'طاقة وضع الجاذبية العامة',kw:'+وضع جاذبيه عامة gravitational potential',f:'U = −G M m / r',lab:-1,a:'طاقة وضع الجاذبية بين كتلتين سالبة وتزداد (تصبح أقل سالبية) كل ما تباعدت الكتلتان.',m:'عند سطح الأرض تقريبيًا نستخدم mgh للتغيرات الصغيرة في الارتفاع.',ex:'الارتفاع من سطح الأرض يزيد طاقة الوضع.'},
{id:'escape_velocity',t:'سرعة الإفلات',kw:'+افلات +escape velocity',f:'v_esc = √(2GM/R)',lab:-1,a:'أقل سرعة عند السطح تكفي للجسم إنه يفلت من جاذبية الكوكب بدون دفع إضافي (بإهمال مقاومة الهواء).',m:'لا تعتمد على كتلة الجسم المفلِت.',ex:'على الأرض تقريبًا 11.2 km/s.'},
{id:'thermodynamics_1',t:'القانون الأول للديناميكا الحرارية',kw:'+ديناميكا حراريه +قانوناول first law',f:'ΔU = Q − W',lab:-1,a:'التغير في الطاقة الداخلية = الحرارة المكتسبة ناقص الشغل المبذول بواسطة النظام (حسب الاصطلاح الشائع).',m:'الطاقة الداخلية دالة حالة، بينما Q و W يعتمدان على المسار.',ex:'لو النظام معزول Q=0 و W=0 → ΔU=0.'},
{id:'entropy_idea',t:'فكرة الإنتروبيا',kw:'+انتروبي +فوضى entropy',f:'',lab:-1,a:'الإنتروبيا مقياس للفوضى أو عدد الطرق المجهرية الممكنة. العمليات التلقائية في نظام معزول تميل لزيادة الإنتروبيا الكلية.',m:'القانون الثاني للديناميكا الحرارية مرتبط بهذا المفهوم.',ex:'خلط غازين مختلفين يزيد الإنتروبيا.'},
{id:'radioactive_dating',t:'التأريخ الإشعاعي',kw:'+تاريخصخري +كربون radioactive dating carbon',f:'t = (T½ / 0.693) ln(N₀/N)',lab:21,a:'بقياس النسبة المتبقية من نظير مشع يمكن تقدير عمر العينة (مثل كربون-14 للآثار العضوية).',m:'يفترض معرفة الكمية الأصلية ومعدل التحلل وانتفاء التلوث.',ex:'لو تبقى ربع الكمية الأصلية → مرّ عمرَا نصف.'},
{id:'xray_production',t:'إنتاج الأشعة السينية',kw:'+اشعهسينية +xray',f:'',lab:-1,a:'تُنتج عندما تتباطأ إلكترونات سريعة فجأة عند اصطدامها بمادة (أشعة الكبح) أو عندما تُنتزع إلكترونات من المستويات الداخلية للذرة.',m:'تستخدم في الطب والصناعة والفحص غير المتلف.',ex:'جهد أنبوب عالي (كيلوفولت) يعطي أشعة أقوى اختراقًا.'},
{id:'photo_cell',t:'الخلايا الكهروضوئية',kw:'+خليه كهروضوئيه photocell solar',f:'',lab:6,a:'تحول الضوء إلى تيار كهربي اعتمادًا على التأثير الكهروضوئي أو الخلايا الشمسية شبه الموصلة.',m:'الخلايا الشمسية الحديثة تعتمد على وصلة p-n.',ex:'تستخدم في الآلات الحاسبة والألواح الشمسية وأجهزة الإنذار.'},
{id:'logic_gates_basic',t:'البوابات المنطقية الأساسية',kw:'+بوابه +and or not logic gate',f:'',lab:-1,a:'AND تعطي 1 فقط لو كل المدخلات 1. OR تعطي 1 لو أي مدخل 1. NOT تعكس المدخل.',m:'أساس الدوائر الرقمية والحواسيب.',ex:'AND لمدخلين 1 و 0 → خرج 0.'},
{id:'binary_basics',t:'النظام الثنائي',kw:'+ثنائي +binary بت',f:'',lab:-1,a:'الحواسيب تستخدم نظام العد الثنائي (0 و 1). كل رقم اسمه بت، و8 بت = بايت.',m:'التحويل من عشري لثنائي بالقسمة المتكررة على 2.',ex:'5 بالعشري = 101 بالثنائي.'},
{id:'current_direction_convention',t:'اتجاه التيار الاصطلاحي',kw:'+تيار اصطلاحي +الكترونات conventional current',f:'',lab:0,a:'الاتجاه الاصطلاحي للتيار من القطب الموجب للسالب خارج المصدر. الإلكترونات تتحرك فعليًا بالعكس.',m:'القوانين والقواعد (فلمنج وغيرها) مبنية على الاتجاه الاصطلاحي.',ex:'في الدائرة البسيطة السهم على السلك يشير من + إلى −.'},
{id:'ammeter_voltmeter',t:'الأميتر والفولتميتر',kw:'+اميتر +فولتميتر ammeter voltmeter',f:'',lab:1,a:'الأميتر يُوصل على التوالي ومقاومته صغيرة جدًا. الفولتميتر يُوصل على التوازي ومقاومته كبيرة جدًا.',m:'عكس التوصيل ممكن يتلف الجهاز أو يعطي قراءة غلط.',ex:'لقياس تيار مصباح: الأميتر في نفس فرع المصباح.'},
{id:'shunt_multiplier',t:'المقاومة المتفرعة والمضاعفة',kw:'+شنت +مضاعفه shunt multiplier',f:'',lab:1,a:'لتوسيع مدى الأميتر نضع مقاومة صغيرة على التوازي (شنت). لتوسيع مدى الفولتميتر نضع مقاومة كبيرة على التوالي.',m:'تحسب قيمة المقاومة حسب المدى المطلوب وتيار أو جهد الجهاز الكامل.',ex:'شنت يحول ميللي أميتر لأميتر بمدى أكبر.'},
{id:'wheatstone',t:'قنطرة ويتستون',kw:'+ويتستون +قنطره wheatstone bridge',f:'P/Q = R/S عند الاتزان',lab:-1,a:'تستخدم لقياس مقاومة مجهولة بدقة. عند اتزان القنطرة (عدمْ تيار في الجلفانومتر) تكون النسبة متساوية.',m:'مفيدة جدًا في المعامل لما المقاومات متوسطة القيمة.',ex:'لو ثلاث مقاومات معروفة والرابعة مجهولة يمكن حسابها من شرط الاتزان.'},
{id:'potentiometer',t:'جهد الجهد (البوتنشيومتر)',kw:'+بوتنشيومتر +جهدجهد potentiometer',f:'',lab:-1,a:'جهاز يقيس جهد أو قوة دافعة بدون سحب تيار تقريبًا من المصدر المقاس، فيعطي دقة أعلى من الفولتميتر العادي.',m:'يعتمد على مقارنة جهد مجهول بجهد معروف على سلك منتظم.',ex:'يُستخدم لمعايرة الجهود وقياس القوة الدافعة الداخلية.'},
{id:'earth_magnetic',t:'مغناطيسية الأرض',kw:'+مغناطيسيه ارض +بوصلات earth magnetic field',f:'',lab:-1,a:'الأرض لها مجال مغناطيسي يشبه مجال قضيب مغناطيسي مائل. البوصلة تستجيب للمركبة الأفقية.',m:'القطب المغناطيسي الشمالي الجغرافي قريب من القطب المغناطيسي الجنوبي للأرض.',ex:'زاوية الانحراف والميل المغناطيسي تختلف حسب المكان.'},
{id:'electromagnet',t:'المغناطيس الكهربي',kw:'+مغناطيس كهربي electromagnet',f:'B ∝ N I',lab:4,a:'ملف يمر فيه تيار يصبح مغناطيسًا. يمكن تقوية المجال بزيادة التيار أو عدد اللفات أو وضع قلب حديدي مطاوع.',m:'يستخدم في الأوناش والمرحلات والجرس الكهربي.',ex:'قلب حديدي يزيد المجال بشكل كبير بسبب النفاذية العالية.'},
{id:'eddy_currents',t:'التيارات الدوامة',kw:'+تيارات دوامه eddy currents',f:'',lab:5,a:'تيارات مستحثة داخل كتل معدنية ضخمة عندما يتغير الفيض خلالها. تسبب فقد طاقة (حرارة) ويمكن الاستفادة منها في الفرملة والكشف عن المعادن.',m:'تقلل بتصفيح القلب الحديدي في المحولات.',ex:'سبب تسخين بعض الأجزاء المعدنية قرب مجالات مترددة قوية.'},
{id:'transformer_laminations',t:'تصفيح قلب المحول',kw:'+تصفيح +محول laminations eddy',f:'',lab:8,a:'قلب المحول يُصنع من شرائح معزولة لتقليل التيارات الدوامة وبالتالي تقليل الفاقد الحراري ورفع الكفاءة.',m:'المادة عادة حديد سيليكوني عالي النفاذية.',ex:'بدون تصفيح الفاقد يكون كبيرًا والكفاءة أقل.'},
{id:'ac_generator_principle',t:'مبدأ المولد المتردد',kw:'+مولد متردد ac generator alternator',f:'ε = NAB ω sinωt',lab:18,a:'ملف يدور في مجال مغناطيسي يتغير فيه الفيض دوريًا فتتولد قوة دافعة مترددة.',m:'التردد يعتمد على سرعة الدوران وعدد الأقطاب.',ex:'في محطات التوليد التردد 50 Hz في معظم الدول.'},
{id:'dc_motor_principle',t:'مبدأ المحرك المستمر',kw:'+محرك مستمر dc motor',f:'τ = N B I A sinθ',lab:12,a:'ملف يمر فيه تيار داخل مجال مغناطيسي يتأثر بعزم يدوره. المبدل (الكمولتير) يعكس التيار للحفاظ على الدوران في نفس الاتجاه.',m:'عكس المولد: هنا ندخل تيار ونحصل على حركة.',ex:'يستخدم في كثير من الأجهزة المنزلية والسيارات.'},
{id:'impedance_triangle',t:'مثلث المعاوقة',kw:'+مثلث معاوقه impedance triangle',f:'Z = √(R²+(XL−XC)²)',lab:19,a:'في دائرة RLC متوالية يمكن تمثيل R و (XL−XC) كضلعين في مثلث قائم، والوتر هو المعاوقة Z.',m:'زاوية الطور φ حيث tanφ = (XL−XC)/R.',ex:'R=30 و XL=40 و XC=0 → Z=50 Ω.'},
{id:'quality_factor',t:'معامل الجودة للدائرة',kw:'+معاملجوده Q factor resonance',f:'Q = ω₀ L / R',lab:14,a:'معامل الجودة يقيس حدة الرنين. Q كبيرة تعني منحنى رنين حاد وانتقائية أعلى.',m:'مهم في دوائر الاستقبال والفلاتر.',ex:'R صغيرة نسبيًا → Q كبيرة → انتقائية أفضل.'},
{id:'skin_effect',t:'التأثير الجلدي',kw:'+تاثيرجلدي skin effect ac',f:'',lab:-1,a:'في التيارات المترددة العالية التردد يميل التيار للتركيز قرب سطح الموصل فتزيد المقاومة الفعالة.',m:'مهم في تصميم كابلات التردد العالي والهوائيات.',ex:'عند الترددات العالية يُستخدم موصلات مجوفة أو مضفرة أحيانًا.'},
{id:'optical_fiber',t:'الألياف البصرية',kw:'+الياف بصريه optical fiber',f:'تعتمد على الانعكاس الكلي الداخلي',lab:-1,a:'تنقل الضوء لمسافات طويلة بخسائر قليلة باستخدام الانعكاس الكلي المتكرر داخل اللب الزجاجي.',m:'أساس الإنترنت الحديث والاتصالات عالية السعة.',ex:'زاوية السقوط داخل الليف أكبر من الزاوية الحرجة فيبقى الضوء محبوسًا.'},
{id:'microscope_telescope',t:'الميكروسكوب والتلسكوب',kw:'+ميكروسكوب +تلسكوب microscope telescope',f:'',lab:-1,a:'الميكروسكوب يكبر الأجسام القريبة جدًا بعدسات مجمعة. التلسكوب يجمع الضوء من أجسام بعيدة ويكبر الزاوية الظاهرية.',m:'كلاهما يعتمد على تكوين صور بواسطة العدسات أو المرايا.',ex:'التلسكوب الفلكي غالبًا مرآتي للأقطار الكبيرة.'},
{id:'color_vision',t:'رؤية الألوان',kw:'+الوان +رؤية color rgb',f:'',lab:-1,a:'الضوء الأبيض خليط أطوال موجية. العين فيها مستقبلات لثلاثة نطاقات (أحمر وأخضر وأزرق تقريبًا) ومنها يُدرك اللون.',m:'خلط ضوئي (إضافة) يختلف عن خلط أصباغ (طرح).',ex:'شاشة التلفزيون تخلط أحمر وأخضر وأزرق لتكوين الألوان.'},
{id:'blackbody',t:'إشعاع الجسم الأسود',kw:'+جسماسود +بلانك blackbody radiation',f:'',lab:-1,a:'الجسم الأسود المثالي يمتص كل الإشعاع ويصدر طيفًا يعتمد فقط على درجة حرارته. قانون بلانك يصف التوزيع، ووينز يعطي طول موجة القمة.',m:'أدى تاريخيًا لظهور فكرة الكم.',ex:'كلما سخن الجسم أكثر مال لون توهجه نحو الأزرق/الأبيض.'},
{id:'compton',t:'تأثير كومبتون',kw:'+كومبتون compton scattering',f:'Δλ = (h/m_e c)(1−cosθ)',lab:-1,a:'تشتت فوتون بأشعة سينية على إلكترون حر تقريبًا فيزداد الطول الموجي. دليل على الطبيعة الجسيمية للضوء.',m:'التغير يعتمد على زاوية التشتت.',ex:'أكبر إزاحة عند θ=180°.'},
{id:'pair_production',t:'إنتاج الزوج',kw:'+انتاجزوج pair production',f:'',lab:-1,a:'فوتون عالي الطاقة (أكبر من 1.022 MeV) يمكن أن يتحول إلى إلكترون وبوزيترون في وجود نواة.',m:'يحقق حفظ الطاقة والشحنة وكمية الحركة بمساعدة النواة.',ex:'يحدث في الأشعة الكونية وأشعة جاما عالية الطاقة.'},
{id:'matter_waves_exp',t:'تجربة دافيسون وجيرمر',kw:'+دافيسون +جيرمر davisson germer',f:'',lab:15,a:'أظهرت حيود الإلكترونات على بلورة نيكل، فأكدت الطبيعة الموجية للإلكترونات كما تنبأ دي برولي.',m:'طول موجة الإلكترونات كان متوافقًا مع λ=h/p.',ex:' complement لتجربة يونج لكن للجسيمات.'},
{id:'bohr_postulates',t:'فروض بوهر',kw:'+بوهر فروض bohr model',f:'mvr = n h/(2π)',lab:9,a:'الإلكترون يدور في مدارات مسموحة بدون إشعاع، والطاقة تنبعث أو تُمتص عند الانتقال بين مستويين. كمية الحركة الزاوية مكممة.',m:'نجح في الهيدروجين وفشل في الذرات الأعقد، وتم تجاوزه بميكانيكا الكم.',ex:'مستويات الطاقة E_n = −13.6/n² eV للهيدروجين.'},
{id:'quantum_numbers',t:'الأعداد الكمية',kw:'+اعدادكميه quantum numbers n l m s',f:'',lab:-1,a:'تصف حالة الإلكترون في الذرة: الرئيسي n، الثانوي l، المغناطيسي m_l، واللف الذاتي m_s.',m:'مرتبطة بشكل المدارات ومستوياتها الفرعية.',ex:'n=2 يمكن أن يكون l=0 أو 1 (مستويان فرعيان s و p).'},
{id:'periodic_trends',t:'اتجاهات الجدول الدوري',kw:'+جدولدوري +سالبية electronegativity ionization',f:'',lab:-1,a:'نصف القطر يقل عبر الدورة ويزيد لأسفل المجموعة. طاقة التأين والسالبية الكهربائية تزيد عمومًا عبر الدورة.',m:'مفيد لفهم الروابط والتفاعلات.',ex:'الفلور أعلى سالبية كهربائية بين العناصر الشائعة.'},
{id:'chemical_bond_types',t:'أنواع الروابط الكيميائية',kw:'+روابط ايوني تساهمي metallic bond',f:'',lab:-1,a:'أيونية: انتقال إلكترونات (فلز + لا فلز). تساهمية: مشاركة (لا فلزات). فلزية: بحر إلكترونات في الفلزات.',m:'نوع الرابطة يؤثر على درجة الانصهار والتوصيل والذوبانية.',ex:'NaCl أيوني، O₂ تساهمي، النحاس فلزي.'},
{id:'mole_concept',t:'المول وعدد أفوجادرو',kw:'+مول +افوجادرو mole avogadro',f:'N_A ≈ 6.022×10²³',lab:-1,a:'المول كمية مادة تحتوي عدد أفوجادرو من الجسيمات. الكتلة المولية بالجرام تساوي الكتلة الذرية أو الجزيئية بوحدة الكتل الذرية.',m:'يربط العالم المجهري بالكتل المقاسة في المعمل.',ex:'1 مول ماء ≈ 18 g ويحتوي 6.022×10²³ جزيء.'},
{id:'stoichiometry_basic',t:'الحسابات الكيميائية البسيطة',kw:'+ستوكيومتري +موازنه stoichiometry',f:'',lab:-1,a:'من المعادلة الموزونة نحسب نسب المولات ثم الكتل أو الحجوم. لازم توازن المعادلة أولًا.',m:'العامل المحدد هو المادة التي تخلص أولًا وتحدد كمية الناتج.',ex:'2H₂ + O₂ → 2H₂O يعني مولان هيدروجين لكل مول أكسجين.'},

// Local knowledge index + IndexedDB import path for large, user-supplied, verified curriculum packs.
const KDB='sifex-knowledge-v6', KSTORE='cards';let importedCards=[];
function openKnowledgeDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('المتصفح لا يدعم قاعدة البيانات المحلية.'));return}const req=indexedDB.open(KDB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(KSTORE)){const os=db.createObjectStore(KSTORE,{keyPath:'id'});os.createIndex('subject','subject',{unique:false});os.createIndex('grade','grade',{unique:false})}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('تعذر فتح قاعدة المعرفة'))})}
async function loadImportedCards(){try{const db=await openKnowledgeDB();const rows=await new Promise((resolve,reject)=>{const tx=db.transaction(KSTORE,'readonly'),rq=tx.objectStore(KSTORE).getAll();rq.onsuccess=()=>resolve(rq.result||[]);rq.onerror=()=>reject(rq.error)});importedCards=rows;db.close()}catch(e){console.warn('knowledge db',e)}}
function cleanCard(x,i){const title=String(x.title||x.t||x.name||'').trim(),content=String(x.content||x.text||x.a||x.definition||'').trim();if(!title||!content)return null;const id=String(x.id||('custom-'+i+'-'+title)).trim().slice(0,180);return{id,title,content,formula:String(x.formula||x.f||'').slice(0,300),keywords:String(x.keywords||x.kw||'').slice(0,1200),subject:String(x.subject||'عام').slice(0,80),grade:String(x.grade||'ثانوي عام').slice(0,80),source:String(x.source||'حزمة محلية مستوردة').slice(0,180)}}
async function importKnowledgeFile(file){if(!file||file.size>35*1024*1024)throw new Error('اختار ملف JSON أقل من 35MB.');const raw=JSON.parse(await file.text()),list=Array.isArray(raw)?raw:raw.items;if(!Array.isArray(list)||!list.length)throw new Error('تنسيق الملف لازم يكون مصفوفة أو كائن فيه items.');if(list.length>100000)throw new Error('الحد الأقصى 100 ألف بطاقة في الاستيراد الواحد.');const rows=list.map(cleanCard).filter(Boolean);if(!rows.length)throw new Error('مفيش بطاقات صالحة. كل بطاقة تحتاج title و content.');const db=await openKnowledgeDB();for(let i=0;i<rows.length;i+=400){await new Promise((resolve,reject)=>{const tx=db.transaction(KSTORE,'readwrite'),os=tx.objectStore(KSTORE);rows.slice(i,i+400).forEach(x=>os.put(x));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('فشل حفظ جزء من البيانات'));tx.onabort=()=>reject(tx.error||new Error('تم إلغاء الحفظ'))})}db.close();await loadImportedCards();return {accepted:rows.length,total:importedCards.length}}
function rankImported(q){const norm=String(q||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim(),parts=norm.split(/\s+/).filter(x=>x.length>1);if(!parts.length)return[];return importedCards.map(c=>{const hay=(c.title+' '+c.content+' '+c.formula+' '+c.keywords+' '+c.subject+' '+c.grade).toLowerCase();let score=0;parts.forEach(w=>{if(hay.includes(w))score+=w.length>=5?3:1});return{...c,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8)}
loadImportedCards();
window.SifexKnowledge={
  stats(){return {physicsTopics:window.PB?.KB?.length||0,labMaterials:window.SifexLab?.count?.()||0,labActivities:window.SifexLab?.activities?.().length||0,liquids:window.SifexLab?.liquids?.().length||0,importedCards:importedCards.length};},
  search(q){const rows=(window.PB?.rank?.(q)||[]).filter(x=>x.s>=2).slice(0,8).map(x=>({type:'physics',title:x.e.t,formula:x.e.f||'',text:x.e.a,score:x.s}));const m=(window.SifexLab?.materials?.()||[]).filter(x=>(x.name+' '+x.id+' '+x.formula).toLowerCase().includes(String(q||'').toLowerCase())).slice(0,8).map(x=>({type:'material',title:x.name,text:`الكثافة ${x.density_g_cm3} g/cm³؛ الانصهار/الليونة ${x.melting_or_softening_C}°م؛ الصيغة ${x.formula||'—'}`,score:1}));return [...rows,...m,...rankImported(q).map(x=>({type:'imported',title:x.title,text:x.content,formula:x.formula,subject:x.subject,grade:x.grade,source:x.source,score:x.score}))].slice(0,18);},
  importFile:importKnowledgeFile, imported:()=>importedCards.slice(), searchImported:rankImported

const get=(k,session=false)=>{try{return(session?sessionStorage:localStorage).getItem(k)||''}catch(e){return''}};
const put=(k,v,session=false)=>{try{(session?sessionStorage:localStorage).setItem(k,v)}catch(e){}};

function searchLinks(q){const e=encodeURIComponent((q||'').trim());const qs=encodeURIComponent((q||'').trim()+' site:moe.gov.eg OR site:ekb.eg');return `<div class="pix-src">ابحث عن الموضوع في:</div><div class="pix-chips"><a class="pix-chip" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${e}">Google</a><a class="pix-chip" target="_blank" rel="noopener noreferrer" href="https://www.bing.com/search?q=${e}">Bing</a><a class="pix-chip" target="_blank" rel="noopener noreferrer" href="https://duckduckgo.com/?q=${e}">DuckDuckGo</a><a class="pix-chip" target="_blank" rel="noopener noreferrer" href="https://search.brave.com/search?q=${e}">Brave</a><a class="pix-chip" target="_blank" rel="noopener noreferrer" href="https://scholar.google.com/scholar?q=${e}">Scholar</a><a class="pix-chip" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${qs}">وزارة التعليم + بنك المعرفة</a></div>`}
function normalizeSearch(j){let a=j?.results||j?.web?.results||j?.organic||j?.data?.results||j?.items||[];if(!Array.isArray(a))a=[];return {answer:String(j?.answer||j?.summary||''),results:a.map(x=>({title:String(x.title||x.name||x.heading||'مصدر'),url:safeUrl(x.url||x.link||x.href),snippet:String(x.snippet||x.description||x.content||x.text||'').slice(0,700),source:String(x.source||x.domain||'')})).filter(x=>x.url).slice(0,8)}}
async function search(q){
  const key='zhvcKZ11cj45PdhudMM9oWPT';
  const qq=String(q||'').trim();
  if(!qq)return {configured:true,answer:'',results:[],error:'اكتب سؤال للبحث.'};
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
    // توسيع الاستعلام لو قصير أو فيه أسماء قوانين عشان ما يطلعش نتائج تجميل/إعلانات
    let qSearch=qq;
    const physHint=/(فيزياء|قانون|ثانوية|مقاومة|تيار|جهد|عدسة|موجة|مجال|حث|سنيل|سنل|أوم|اوم|كيرشوف|فاراداي)/i.test(qq);
    if(qq.length<40 || !physHint){
      qSearch = qq + (physHint ? '' : ' فيزياء');
      if(qq.length<20) qSearch += ' قانون ثانوية عامة';
    }
    const params=new URLSearchParams({
      engine:'google',
      q:qSearch,
      api_key:key,
      hl:'ar',
      gl:'eg',
      google_domain:'google.com.eg',
      num:'10'
    });
    const r=await fetch('https://www.searchapi.io/api/v1/search?'+params.toString(),{method:'GET',signal:controller.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const organic=j.organic_results||j.organic||[];
    const kg=j.knowledge_graph||{};
    const answerBox=j.answer_box||{};
    const results=organic.map(x=>({
      title:String(x.title||''),
      url:String(x.link||x.url||''),
      snippet:String(x.snippet||x.description||''),
      source:String(x.source||x.displayed_link||'')
    })).filter(x=>x.url).slice(0,8);
    let answer='';
    if(answerBox.answer)answer=String(answerBox.answer);
    else if(answerBox.snippet)answer=String(answerBox.snippet);
    else if(kg.description)answer=String(kg.description);
    else if(results.length){
      // صياغة شبيهة بـ GPT من المقتطفات
      answer=results.slice(0,4).map((x,i)=>(i+1)+') '+x.title+' — '+x.snippet).join('\n\n');
    }
    return {configured:true,answer,results,raw:j};
  }catch(e){
    return {configured:true,answer:'',results:[],error:e.name==='AbortError'?'البحث استغرق وقتًا طويلًا.':'مفيش اتصال بالإنترنت دلوقتي.'};
  }finally{clearTimeout(timer)}
}
function renderSearch(r,q){if(r&&r.results){const junk=/(بشرة|سيروم|كريم|حلزون|vip|SNAILS?|REPAIR|ماسك|تجميل|اشتري|متجر|شراء|عطر|مكياج)/i;r={...r,results:r.results.filter(x=>!junk.test((x.title||'')+' '+(x.snippet||'')))}}
  if(!r?.results?.length && !r?.answer){
    return `<div class="pix-src">${esc(r?.error||'مفيش نتائج.')}</div>${searchLinks(q)}`;
  }
  let h=`<div class="pix-block"><b class="k">نتائج البحث</b><div class="pix-src">نتائج حقيقية من الإنترنت. راجع المصدر قبل الاعتماد.</div></div>`;
  if(r.answer){
    h+=`<div class="pix-sol" style="white-space:pre-wrap;line-height:1.85"><b class="k">الملخص</b><br>${esc(r.answer)}</div>`;
  }
  if(r.results?.length){
    h+=`<div class="pix-block"><b class="k">المصادر</b></div>`;
    h+=r.results.map((x,i)=>`<div class="pix-sol" style="margin-top:8px"><b>[${i+1}] <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" style="color:#8dd9ff">${esc(x.title)}</a></b>${x.source?` <span class="pix-src">· ${esc(x.source)}</span>`:''}<div style="font-size:13px;margin-top:4px;line-height:1.7">${esc(x.snippet)}</div></div>`).join('');
  }
  return h;
}

<script>
/* Sifex · Google Sign-In + student profile + counter (secured) */
(function(){
  const NS = 'sifex_auth_v2';
  const CID_KEY = 'sifex_google_client_id';
  // ضع Client ID هنا بعد إنشائه من Google Cloud
  const DEFAULT_CLIENT_ID = '750521330308-obhbo04sjvjgmso0e27ovntsepsmhuad.apps.googleusercontent.com';

  const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const safeUrl = (u) => {
    try {
      const x = new URL(String(u||''), location.href);
      if (x.protocol === 'https:' && /\.googleusercontent\.com$|\.google\.com$|\.ggpht\.com$/i.test(x.hostname)) return x.href;
    } catch(e) {}
    return '';
  };

  const getCid = () => (DEFAULT_CLIENT_ID || '').trim();
  const setCid = (v) => { try { localStorage.setItem(CID_KEY, (v||'').trim()); } catch(e){} };

  const getUser = () => { try { return JSON.parse(localStorage.getItem(NS)||'null'); } catch(e){ return null; } };
  const setUser = (u) => { try { localStorage.setItem(NS, JSON.stringify(u)); } catch(e){} };
  const clearUser = () => { try { localStorage.removeItem(NS); } catch(e){} };

  async function fetchStudentCount(hit){
    // المصدر الأساسي: التخزين المحلي (لا يعتمد على سيرفر عشان ميضيعش)
    const LS_KEY = 'sifex_students_v34_local';
    let n = 0;
    try { n = parseInt(localStorage.getItem(LS_KEY) || '0', 10); } catch(e) { n = 0; }
    if (!Number.isFinite(n) || n < 0) n = 0;
    if (hit) {
      n += 1;
      try { localStorage.setItem(LS_KEY, String(n)); } catch(e) {}
      // محاولة مزامنة اختيارية مع خدمة عامة (لو وقعت مش مشكلة)
      try {
        fetch('https://api.countapi.xyz/hit/sifex-students-v34', { cache: 'no-store' }).catch(()=>{});
      } catch(e) {}
    }
    return n;
  }

  function parseJwt(token){
    try {
      if (!token || typeof token !== 'string' || token.length > 8192) return null;
      const parts = token.split('.');
      if (parts.length < 2) return null;
      const base = parts[1].replace(/-/g,'+').replace(/_/g,'/');
      const pad = base + '='.repeat((4 - base.length % 4) % 4);
      const json = decodeURIComponent(atob(pad).split('').map(c => '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      const obj = JSON.parse(json);
      if (!obj || typeof obj !== 'object' || !obj.sub) return null;
      return obj;
    } catch(e){ return null; }
  }

  function needsProfile(u){
    return !!(u && u.sub && !(u.displayName && String(u.displayName).trim()));
  }

  function showProfileSetup(u){
    try{ if(typeof end3==='function') end3(); }catch(e){}
    const app = document.getElementById('app');
    if(!app) return;
    const suggested = esc((u && (u.name || u.email && u.email.split('@')[0])) || 'طالب');
    app.innerHTML = `
      <div class="top"><div class="btn stars">حساب الطالب</div></div>
      <div class="pn" style="max-width:420px;margin:0 auto">
        <div style="text-align:center;margin-bottom:14px">
          ${u && safeUrl(u.picture) ? `<img src="${safeUrl(u.picture)}" width="72" height="72" referrerpolicy="no-referrer" style="border-radius:50%;border:2px solid var(--b);box-shadow:0 8px 24px #0006">` : ''}
          <h3 style="margin:12px 0 4px">اختار اسم حسابك</h3>
          <p class="sub" style="margin:0;font-size:13px">الاسم ده هيظهر فوق في الواجهة قدام باقي الطلاب</p>
        </div>
        <label class="sub" style="display:block;margin-bottom:6px;font-size:13px">اسم الطالب</label>
        <input id="sxDispName" class="nb" maxlength="24" value="${suggested}" placeholder="مثال: أحمد · فيزياء" style="width:100%;margin-bottom:12px;text-align:right;direction:rtl">
        <button class="btn go on" id="sxSaveName" style="width:100%;min-height:48px;font-size:16px">حفظ والدخول للمنصة</button>
        <p class="sub" style="font-size:12px;margin-top:12px;line-height:1.7">تقدر تغيّر الاسم بعدين من الإعدادات. تسجيل الخروج من الإعدادات كمان.</p>
      </div>`;
    const input = document.getElementById('sxDispName');
    const save = document.getElementById('sxSaveName');
    if(input){ input.focus(); input.select && input.select(); }
    const doSave = () => {
      const name = (input && input.value || '').trim().replace(/\s+/g,' ').slice(0,24);
      if(name.length < 2){ alert('اكتب اسم من حرفين على الأقل'); return; }
      const cur = getUser() || u || {};
      cur.displayName = name;
      cur.ts = Date.now();
      setUser(cur);
      try{ if(typeof home==='function') home(); }catch(e){}
      setTimeout(renderAuthBar, 50);
    };
    if(save) save.onclick = doSave;
    if(input) input.onkeydown = (e)=>{ if(e.key==='Enter') doSave(); };
  }

  async function onGoogleCredential(resp){
    const payload = parseJwt(resp.credential || '');
    if (!payload || !payload.sub) {
      alert('تعذر قراءة حساب Google. تأكد أن أصل الصفحة مضاف في Authorized JavaScript origins.');
      return;
    }
    const prev = getUser();
    const rawName = String(payload.name || payload.given_name || 'طالب').slice(0, 80);
    const rawEmail = String(payload.email || '').slice(0, 120);
    const rawPic = String(payload.picture || '').slice(0, 500);
    const user = {
      sub: String(payload.sub).slice(0, 64),
      name: rawName,
      email: /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(rawEmail) ? rawEmail : '',
      picture: rawPic,
      provider: 'google',
      ts: Date.now(),
      // احتفظ بالاسم المختار لو نفس الحساب
      displayName: (prev && prev.sub === String(payload.sub) && prev.displayName) ? prev.displayName : ''
    };
    setUser(user);

    // عدّ طالب جديد مرة واحدة لكل حساب Google (sub)
    try {
      const seenKey = 'sifex_counted_subs';
      let seen = [];
      try { seen = JSON.parse(localStorage.getItem(seenKey) || '[]'); } catch(e) { seen = []; }
      if (!Array.isArray(seen)) seen = [];
      if (!seen.includes(payload.sub)) {
        await fetchStudentCount(true);
        seen.push(payload.sub);
        if (seen.length > 500) seen = seen.slice(-500);
        localStorage.setItem(seenKey, JSON.stringify(seen));
      }
    } catch(e) {}

    const modal = document.getElementById('sifexAuthModal');
    if (modal) modal.remove();

    if (needsProfile(user)) {
      showProfileSetup(user);
    } else {
      try{ if(typeof home==='function') home(); }catch(e){}
      renderAuthBar();
    }
  }

  function renderGoogleButton(target){
    const cid = getCid();
    if (!cid) {
      target.innerHTML = '<p class="sub" style="font-size:12px;color:var(--danger)">Client ID غير مضبوط في نسخة المنصة.</p>';
      return;
    }
    if (!window.google || !google.accounts || !google.accounts.id) {
      target.innerHTML = '<p class="sub" style="font-size:12px">جاري تحميل Google… حدّث الصفحة لو استمرت الرسالة.</p>';
      setTimeout(() => renderGoogleButton(target), 600);
      return;
    }
    target.innerHTML = '';
    try {
      google.accounts.id.initialize({
        client_id: cid,
        callback: onGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true,
        context: 'signin',
        ux_mode: 'popup',
        itp_support: true
      });
      google.accounts.id.renderButton(target, {
        theme: 'outline',
        size: 'large',
        shape: 'pill',
        text: 'signin_with',
        logo_alignment: 'left',
        width: Math.min(360, (target.clientWidth || 320))
      });
    } catch(e) {
      target.innerHTML = '<p class="sub" style="color:var(--danger)">خطأ في تهيئة Google: '+String(e.message||e)+'</p>';
    }
  }

  function authModal(){
    if (document.getElementById('sifexAuthModal')) return;
    const d = document.createElement('div');
    d.id = 'sifexAuthModal';
    d.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center';
    d.innerHTML = `<div class="pn" style="width:min(420px,100%);border-radius:22px 22px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,176,32,.25)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b style="font-size:17px">تسجيل الدخول · Sifex</b>
        <button class="btn" id="authX" style="min-width:42px">✕</button>
      </div>
      <p class="sub" style="font-size:13px;margin:0 0 16px;line-height:1.7">سجّل بحساب Google عشان تختار اسمك كطالب ويتضاف لعداد طلاب المنصة.</p>
      <div id="gBtnHost" style="display:flex;justify-content:center;min-height:48px"></div>
      <p class="sub" style="font-size:11px;margin:14px 0 0;line-height:1.65;opacity:.85">أول تسجيل من حساب جديد بيزوّد العداد مرة واحدة. بياناتك على جهازك.</p>
    </div>`;
    document.body.appendChild(d);
    d.addEventListener('click', e => { if (e.target === d) d.remove(); });
    document.getElementById('authX').onclick = () => d.remove();
    renderGoogleButton(document.getElementById('gBtnHost'));
  }

  function signOut(){
    clearUser();
    try { google?.accounts?.id?.disableAutoSelect?.(); } catch(e){}
    try{ if(typeof home==='function') home(); }catch(e){}
    setTimeout(renderAuthBar, 40);
  }

  async function renderAuthBar(){
    const app = document.getElementById('app');
    if (!app) return;

    // لو مسجّل ومختارش اسم → صفحة الاسم
    const uCheck = getUser();
    if (needsProfile(uCheck)) {
      // متظهرش البار فوق صفحة الاسم
      const old = document.getElementById('sifexAuthBar');
      if (old) old.remove();
      // لو مش بالفعل في صفحة الاسم
      if (!document.getElementById('sxDispName')) showProfileSetup(uCheck);
      return;
    }

    let bar = document.getElementById('sifexAuthBar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'sifexAuthBar';
      bar.className = 'sifex-auth-bar';
      // فوق محتوى الواجهة مباشرة
      if (app.firstChild) app.insertBefore(bar, app.firstChild);
      else app.appendChild(bar);
    } else if (bar.parentNode !== app || app.firstChild !== bar) {
      app.insertBefore(bar, app.firstChild);
    }

    const n = await fetchStudentCount(false);
    const u = getUser();
    const shown = u && u.displayName ? u.displayName : '';
    const safeName = esc(shown);
    const pic = u ? safeUrl(u.picture) : '';

    if (u && shown) {
      // مسجّل: عداد + اسم الطالب (من غير زر تسجيل)
      bar.innerHTML = `
        <div class="sx-left">
          <div class="sx-label">طلاب Sifex</div>
          <div class="cnt">${Number(n).toLocaleString('ar-EG')}</div>
        </div>
        <div class="sx-right">
          ${pic ? `<img class="sx-av" src="${pic}" alt="" width="32" height="32" referrerpolicy="no-referrer">` : `<span class="sx-av sx-av-ph">👤</span>`}
          <div class="sx-who">
            <div class="sx-role">طالب</div>
            <div class="sx-name">${safeName}</div>
          </div>
        </div>`;
    } else {
      // مش مسجّل: زر تسجيل ظاهر + عداد
      bar.innerHTML = `
        <div class="sx-left">
          <div class="sx-label">طلاب Sifex</div>
          <div class="cnt">${Number(n).toLocaleString('ar-EG')}</div>
        </div>
        <button class="btn sx-login" id="authIn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 12a5 5 0 100-10 5 5 0 000 10z" stroke="currentColor" stroke-width="1.8"/><path d="M3 21a9 9 0 0118 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          تسجيل الدخول
        </button>`;
      const bi = document.getElementById('authIn');
      if (bi) bi.onclick = authModal;
    }
  }

  // حقن زر الخروج في الإعدادات
  function injectSettingsLogout(){
    const root = document.getElementById('app');
    if (!root || document.getElementById('sxLogoutBtn')) return;
    const u = getUser();
    if (!u || !u.displayName) return;
    // دور على .pn جوه الإعدادات
    const pn = root.querySelector('.pn');
    if (!pn) return;
    const box = document.createElement('div');
    box.id = 'sxLogoutBtn';
    box.style.cssText = 'margin-top:18px;padding-top:14px;border-top:1px solid var(--b)';
    box.innerHTML = `
      <h3 style="margin:0 0 8px">الحساب</h3>
      <p class="sub" style="font-size:13px;margin:0 0 10px">مسجّل كـ <b>${esc(u.displayName)}</b>${u.email ? ' · '+esc(u.email) : ''}</p>
      <button class="btn" id="sxEditName" style="width:100%;margin-bottom:8px">تغيير اسم الحساب</button>
      <button class="btn" id="sxDoLogout" style="width:100%;border-color:var(--danger);color:var(--danger)">تسجيل الخروج</button>`;
    pn.appendChild(box);
    const ed = document.getElementById('sxEditName');
    if (ed) ed.onclick = () => {
      const cur = getUser();
      if (!cur) return;
      cur.displayName = '';
      setUser(cur);
      showProfileSetup(cur);
    };
    const lo = document.getElementById('sxDoLogout');
    if (lo) lo.onclick = signOut;
  }

  // لف openSettings عشان نضيف زر الخروج
  function wrapSettings(){
    const prev = window.openSettings;
    if (typeof prev !== 'function' || prev.__sxWrapped) return;
    const wrapped = function(){
      const r = prev.apply(this, arguments);
      setTimeout(injectSettingsLogout, 30);
      setTimeout(injectSettingsLogout, 120);
      return r;
    };
    wrapped.__sxWrapped = true;
    window.openSettings = wrapped;
  }

  const prevHome = window.home;
  window.home = function(){
    const r = prevHome && prevHome.apply(this, arguments);
    setTimeout(() => { wrapSettings(); renderAuthBar(); }, 40);
    return r;
  };

  // ستايل البار
  if (!document.getElementById('sx-auth-css')) {
    const st = document.createElement('style');
    st.id = 'sx-auth-css';
    st.textContent = `
.sifex-auth-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 0 14px;padding:12px 14px;border-radius:16px;
  background:linear-gradient(135deg,rgba(255,176,32,.12),rgba(62,224,198,.08));
  border:1px solid rgba(255,176,32,.22);
  box-shadow:0 8px 28px rgba(0,0,0,.28);
}
.sifex-auth-bar .sx-label{font-size:11px;color:var(--m);letter-spacing:.02em}
.sifex-auth-bar .cnt{font-weight:800;color:var(--a);font-variant-numeric:tabular-nums;font-size:20px;line-height:1.15}
.sifex-auth-bar .sx-right{display:flex;align-items:center;gap:10px;min-width:0}
.sifex-auth-bar .sx-av{border-radius:50%;border:1px solid var(--b);object-fit:cover;flex:none}
.sifex-auth-bar .sx-av-ph{width:32px;height:32px;display:grid;place-items:center;background:#1a2230;font-size:14px}
.sifex-auth-bar .sx-who{min-width:0}
.sifex-auth-bar .sx-role{font-size:10px;color:var(--c);font-weight:700}
.sifex-auth-bar .sx-name{font-size:14px;font-weight:700;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sifex-auth-bar .sx-login{
  min-height:42px;padding:8px 14px;border-radius:999px;font-weight:700;gap:8px;
  background:linear-gradient(135deg,var(--a),#ff8a3d)!important;color:#1a1000!important;border:0!important;
  box-shadow:0 6px 20px rgba(255,176,32,.35);
}
.sifex-auth-bar .sx-login:active{transform:scale(.97)}
#sxSaveName.go.on{box-shadow:0 8px 24px rgba(255,176,32,.35)}
`;
    document.head.appendChild(st);
  }

  document.addEventListener('DOMContentLoaded', () => {
    wrapSettings();
    setTimeout(renderAuthBar, 200);
  });
  setTimeout(() => { wrapSettings(); renderAuthBar(); }, 600);
  setTimeout(renderAuthBar, 1200);

  window.SifexAuth = { getUser, getCid, setCid, renderAuthBar, signIn: authModal, signOut, showProfileSetup };
})();
</script>

law:['الملف بيعاكس تغيّر التيار المتردد، ومفاعلته الحثية XL = 2πfL تزيد مع التردد والحث الذاتي، فبيقل التيار: I = V/XL.','A coil opposes changes in AC current. Its inductive reactance XL = 2πfL grows with frequency and inductance, so the current drops: I = V/XL.'],

const KEY='sx_nn25',UKEY='sx_nn25_u',MKEY='sx_nn25_m';

try{U=JSON.parse(localStorage.getItem(UKEY)||'[]')}catch(e){}
try{MEM=JSON.parse(localStorage.getItem(MKEY)||'{}')}catch(e){}
const sig=()=>'v3:'+DIM+'x'+H+':'+seedSamples().length;
const b64=f=>{const u=new Uint8Array(f.buffer);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=(s,n)=>{const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return new Float32Array(u.buffer).slice(0,n)};
const q16=f=>{let m=1e-6;for(let i=0;i<f.length;i++){const a=Math.abs(f[i]);if(a>m)m=a}const sc=m/32767,q=new Int16Array(f.length);for(let i=0;i<f.length;i++)q[i]=Math.round(f[i]/sc);const u=new Uint8Array(q.buffer);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return sc+'|'+btoa(s)};
const uq16=(s,n)=>{const k=s.indexOf('|'),sc=+s.slice(0,k),r=atob(s.slice(k+1)),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);const q=new Int16Array(u.buffer),f=new Float32Array(n);for(let i=0;i<n;i++)f[i]=q[i]*sc;return f};
function save(){try{localStorage.setItem(KEY,JSON.stringify({sig:sig(),ep:epochs,acc:lastAcc,h:hist.slice(-60),w1:q16(W1),b1:b64(B1),w2:b64(W2),b2:b64(B2)}));localStorage.setItem(UKEY,JSON.stringify(U.slice(-300)))}catch(e){}}
function mem(k){MEM[k]=(MEM[k]||0)+1;try{localStorage.setItem(MKEY,JSON.stringify(MEM))}catch(e){}}
function buildS(){S=seedSamples();U.forEach(u=>{const y=INT.indexOf(u[1]);if(y>=0)S.push({t:u[0],y,x:feat(u[0])})})}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function train(n,lr,reset,cb){if(reset){initNet();hist=[];epochs=0}buildS();
 for(let e=0;e<n;e++){const L=epoch(S,lr||.3);epochs++;hist.push(+L.toFixed(4));{cb&&cb(e+1,n,L);await tick()}}
 lastAcc=acc(S);ready=true;save();cb&&cb(n,n,hist[hist.length-1]);return lastAcc}
async function boot(){let ok=false;try{const j=JSON.parse(localStorage.getItem(KEY)||'null');
  if(j&&j.sig===sig()){initNet();W1=uq16(j.w1,DIM*H);B1=unb64(j.b1,H);W2=unb64(j.w2,H*K);B2=unb64(j.b2,K);epochs=j.ep||0;lastAcc=j.acc||0;hist=j.h||[];buildS();ready=true;ok=true}}catch(e){}

function teach(t,name,n){t=String(t||'').trim();if(!t||INT.indexOf(name)<0)return Promise.resolve(lastAcc);U.push([t,name]);if(U.length>300)U.shift();return train(n||30,.3,false)}

const NW={صفر:0,واحد:1,واحده:1,اتنين:2,اثنين:2,تلاته:3,ثلاثه:3,اربعه:4,خمسه:5,سته:6,سبعه:7,تمانيه:8,ثمانيه:8,تسعه:9,عشره:10,احداشر:11,اتناشر:12,تلتاشر:13,اربعتاشر:14,خمستاشر:15,ستاشر:16,سبعتاشر:17,تمنتاشر:18,تسعتاشر:19,عشرين:20,تلاتين:30,ثلاثين:30,اربعين:40,خمسين:50,ستين:60,سبعين:70,تمانين:80,ثمانين:80,تسعين:90,ميه:100,مايه:100,مائه:100,ميتين:200,مئتين:200,الف:1000,الفين:2000,نص:.5,نصف:.5};
function numWords(t){const w=String(t).split(/\s+/),o=[];let i=0,ch=0;
 while(i<w.length){const k=norm(w[i]);if(NW[k]!==undefined&&!/^\d/.test(k)){let v=NW[k],j=i+1;
   while(j<w.length){let x=norm(w[j]);if(x[0]==='و'&&NW[x.slice(1)]!==undefined)x=x.slice(1);
    if(NW[x]===undefined)break;if(x==='الف'||x==='الفين'){v=(v||1)*NW[x]}else v+=NW[x];j++}
   o.push(String(v));ch=1;i=j}else{o.push(w[i]);i++}}
 return ch?o.join(' '):t}

/* semantic match of free text against lab names (same text->vector->cosine idea) */
const cos=(a,b)=>{const m=new Map();a.id.forEach((i,k)=>m.set(i,a.vl[k]));let s=0;b.id.forEach((i,k)=>{if(m.has(i))s+=m.get(i)*b.vl[k]});return s};
const STOP=/\b(open|show|take|me|to|the|lab|experiment|model|for|of)\b|افتح|شغلي|شغل|وديني|اعرض|فتحلي|عايز|اجرب|وريني|لمعمل|معمل|تجربه|التجربه|المجسم|بتاع/g;
function findLab(t){try{const q=feat(norm(t).replace(STOP,' '));if(!q.id.length)return -1;let best=-1,bs=0;
 LABS.forEach((l,i)=>{let nm=l.n+' '+(l.d||'');try{if(typeof EN!=='undefined'&&EN[i])nm+=' '+EN[i]}catch(e){}const s=cos(q,feat(nm));if(s>bs){bs=s;best=i}});return bs>.14?best:-1}catch(e){return -1}}

async function execIntent(nm,t,t2,show){let canon=null;const n=norm(t2);
 if(nm==='openlab'){const i=findLab(t2);if(i<0)return false;
   if(show)pixUser(t);pixBot('<div class="pix-block">'+T('أفتحلك معمل','Opening lab')+' <b>'+esc(LABS[i].n)+'</b> …</div>');mem('lab:'+i);setTimeout(()=>{try{pixOpenLab(i)}catch(e){}},700);return true}
 if(nm==='explain')canon=/^(اشرح|وضح|فهمني|explain|what|ايه|يعني)/.test(n)?t2:'اشرح '+t2;
 else if(nm==='plan'){const d=n.match(/(\d+)/);canon='خطة مذاكرة'+(d?' '+d[1]:'')}
 else if(nm==='syllabus')canon=/(اول|تاني|تالت|ثاني|ثالث|grade|صف|\b1[012]\b)/.test(n)?t2:'المنهج';
 else canon=CANON[nm];
 if(!canon)return false;
 if(show)pixUser(t);
 await silent(()=>prev(canon));
 mem(nm);return true}
async function one(t,show){try{const t2=numWords(t),n=norm(t2);
 const guard=/\d|=/.test(n)||n.split(' ').length>14||/^(وقف|ايقاف|خلاص|stop|quit|exit|تخطي|skip|next|التالي)$/.test(n);

  const p2=Math.max(...[...r.p].filter((_,k)=>k!==i));if((p>=.62||(p>=.5&&p-p2>=.3))&&ROUTE.has(nm)){let ok=false;try{ok=await execIntent(nm,t,t2,show)}catch(e){console.warn('nn exec',e)}
   if(ok){try{autoLearn(t2,i,p)}catch(e){}return}}}
 if(t2!==t){if(show)pixUser(t);return silent(()=>prev(t2))}
 return prev(t)}catch(e){console.warn('pix one',e);return prev(t)}}
window.pixHandle=async function(t){t=String(t||'').trim();if(!t)return prev&&prev(t);
 const parts=t.split(/\s+(?:ثم|وبعدين|وبعد كده|وبعد كدا|and then|then)\s+/i).filter(Boolean);

 const flat=typeof md!=='undefined'&&md==2;
 const an=Math.min(8,RD.capabilities.getMaxAnisotropy?RD.capabilities.getMaxAnisotropy():1);
 sc.traverse(o=>{
  if(o.isLight&&o.shadow&&o.castShadow){const c=o.shadow.mapSize.x,ms=mob?Math.min(1024,Math.max(512,c)):2048;
   o.shadow.bias=-.0004;o.shadow.normalBias=.03;
   if(c!==ms){o.shadow.mapSize.set(ms,ms);if(o.shadow.map){o.shadow.map.dispose();o.shadow.map=null}}}
  if(o.isMesh&&o.material)[].concat(o.material).forEach(m=>{if(m.map&&m.map.image&&m.map.anisotropy<an){m.map.anisotropy=an;m.map.needsUpdate=true}})});
 /* soft sky/ground fill + cool rim light for depth */
 const lg=new TH.Group();lg.add(new TH.HemisphereLight(0x9db8ff,0x1a1030,.28));
 const rim=new TH.DirectionalLight(0xb9a8ff,.35);rim.position.set(-6,5,-8);lg.add(rim);lg.visible=!flat;sc.add(lg);u.v30L=lg;
 /* stage glow breathes slowly */
 const st=u.stage,pool=st&&st.children[0],ring=st&&st.children[1];
 if(pool&&ring){const br=()=>{if(!SCN||SCN.sc!==sc||!document.body.contains(SCN.cv))return;
  if(!document.hidden&&st.visible){const t=performance.now()/1000;pool.material.opacity=.2+.05*Math.sin(t*1.2);ring.material.opacity=.22+.08*Math.sin(t*1.2+1)}
  requestAnimationFrame(br)};requestAnimationFrame(br)}
}catch(e){console.warn('v30 tune',e)}}
try{const _o=open_;open_=function(){const r=_o.apply(this,arguments);tune();return r}}catch(e){}
try{const _m=setMd;setMd=function(m){const r=_m.apply(this,arguments);try{const l=SCN&&SCN.sc&&SCN.sc.userData.v30L;if(l)l.visible=m!=2}catch(e){}return r}}catch(e){}

/* 3) tap shockwave ring (pairs with the v29 spark burst) */
const live=[],rg=new TH.RingGeometry(.85,1,48);let run=0;
function tick(){const t=performance.now();
 for(let k=live.length-1;k>=0;k--){const w=live[k];w.a+=(t-w.t)/1000;w.t=t;const f=w.a/.7;
  if(f>=1){w.sc.remove(w.m);w.m.material.dispose();live.splice(k,1);continue}
  const s=.15+f*2.2;w.m.scale.set(s,s,s);w.m.material.opacity=.7*(1-f)*(1-f)}
 if(live.length)requestAnimationFrame(tick);else run=0}
function wave(sc,p){const m=new TH.Mesh(rg,new TH.MeshBasicMaterial({color:0xffc27a,transparent:true,opacity:.7,side:2,depthWrite:false,blending:TH.AdditiveBlending}));
 m.rotation.x=-Math.PI/2;m.position.set(p.x,p.y+.04,p.z);m.raycast=()=>{};sc.add(m);live.push({m,sc,a:0,t:performance.now()});
 if(!run){run=1;requestAnimationFrame(tick)}}
let d0=null;
document.addEventListener('pointerdown',e=>{d0=(typeof SCN!=='undefined'&&SCN&&e.target===SCN.cv)?{x:e.clientX,y:e.clientY,t:performance.now()}:null},true);
document.addEventListener('pointerup',e=>{try{const d=d0;d0=null;if(!d||typeof SCN==='undefined'||!SCN||e.target!==SCN.cv)return;
 if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>8||performance.now()-d.t>350)return;
 const r=SCN.cv.getBoundingClientRect(),m=new TH.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),rc=new TH.Raycaster();rc.setFromCamera(m,SCN.cam);
 const h=rc.intersectObjects(SCN.g.children,true).filter(x=>x.object.isMesh);let p;
 if(h.length)p=h[0].point.clone();else{const pl=new TH.Plane(new TH.Vector3(0,1,0),-.3),q=new TH.Vector3();if(!rc.ray.intersectPlane(pl,q))return;p=q}
 wave(SCN.sc,p)}catch(x){console.warn('v30',x)}},true);
})();
</script>
